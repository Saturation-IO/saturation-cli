    ViewFormat:
      type: string
      description: The render shape a view resolves into.
      enum:
      - table
      - board
      - calendar
      - timeline
      - gallery
    ViewVisibility:
      type: string
      description: Who can see the view.
      enum:
      - personal
      - workspace
    View:
      type: object
      description: A saved view, a named, persisted filter + shape bundle over a subject (e.g. transactions or budget lines).
        A view is the deep, persisted equivalent of inline filters; `GET /views/{viewId}/data` resolves it and inline filters
        layer on top.
      required:
      - id
      - projectId
      - name
      - subjectType
      - format
      - visibility
      - createdAt
      - updatedAt
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        projectId:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          examples:
          - VFX over budget
        description:
          type:
          - string
          - 'null'
        subjectType:
          type: string
          description: The resource the view filters over (e.g. `transactions`, `budgetLines`).
          examples:
          - transactions
        format:
          $ref: '#/components/schemas/ViewFormat'
        visibility:
          $ref: '#/components/schemas/ViewVisibility'
        filter:
          type: object
          description: The persisted deep filter (operators, AND/OR groups, negation) the view replays. Opaque to the client;
            resolved server-side by `/views/{viewId}/data`.
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ViewList:
      type: object
      description: A page of saved views for the project.
      required:
      - data
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/View'
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
        count:
          type: integer
          description: Total matching items; present only when `withCount=true` was requested.
        truncated:
          type: boolean
          description: True when permission filtering or an expand returned fewer rows than `limit`.
    ViewData:
      type: object
      description: The resolved rows of a view, with the view's saved filter applied and any inline `expand` / flat filters
        layered on top. The row shape matches the view's `subjectType` resource; pagination follows the standard response
        format.
      required:
      - data
      - subjectType
      additionalProperties: false
      properties:
        subjectType:
          type: string
          description: The resource type of the rows (echoed so the client can type the payload).
          examples:
          - transactions
        data:
          type: array
          description: The resolved rows (shape determined by `subjectType`).
          items:
            type: object
            additionalProperties: true
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
        count:
          type: integer
          description: Total matching items; present only when `withCount=true` was requested.
        truncated:
          type: boolean
          description: True when permission filtering or an expand returned fewer rows than `limit`.
    HealthStatus:
      type: object
      description: 'Liveness / readiness of the public API edge. Unauthenticated. `ok` reflects whether the dedicated database
        pool is reachable; a degraded edge returns `ok: false` with `503`, never a misleading `200`.'
      required:
      - status
      - time
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
          description: '`ok` when the edge can reach its dedicated database pool; `degraded` when a dependency check failed
            (served with HTTP `503`).'
        time:
          type: string
          format: date-time
          description: Server time the check ran (ISO-8601).
        version:
          type: string
          description: The deployed `/v1` contract version (e.g. `1.0.0`).
        sha:
          type: string
          description: Git commit SHA of the deployed build, stamped by the deployment pipeline. Absent when no release SHA
            was stamped (e.g. local dev). The release workflow polls this to verify the public edge has cut over to the promoted
            commit.
      example:
        status: ok
        time: '2026-05-28T17:04:09.000Z'
        version: 1.0.0
        sha: 9c2b04878d1f4c1f0e2a7b6d5c4e3f2a1b0c9d8e
    PrincipalType:
      type: string
      description: What kind of principal a token acts as. A `user` token inherits a person's live workspace ability; a `service`
        token acts as a service identity that carries its own live-resolved role and survives staff churn.
      enum:
      - user
      - service
    WorkspaceReach:
      type: object
      description: The workspace a token can act on, paired with the principal's current role there. Roles resolve live per
        request, never a frozen claim. Internal teamId / teamRole are never exposed.
      required:
      - workspaceId
      - workspaceRole
      additionalProperties: false
      properties:
        workspaceId:
          $ref: '#/components/schemas/Id'
        workspaceRole:
          $ref: '#/components/schemas/WorkspaceRole'
    WorkspaceRole:
      type: string
      description: The principal's role in a workspace, mirroring the product's role vocabulary. Ordering for any ceiling
        check is `owner > admin > accountant > edit > comment > view`.
      enum:
      - owner
      - admin
      - accountant
      - edit
      - comment
      - view
    Me:
      type: object
      description: The token's own identity and workspace, the first call any integration makes and the Zapier / n8n auth-probe.
        No path params; works before any workspace is known. Tokens list only their bound workspace. Never leaks teamId /
        teamRole.
      required:
      - id
      - type
      - workspaces
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        type:
          $ref: '#/components/schemas/PrincipalType'
        email:
          type: string
          format: email
          description: The acting user's email. Present for `user` principals; omitted for `service` principals (which have
            no email).
        name:
          type: string
          description: Display name of the acting principal, the person's name for a `user` token, the service identity's
            label for a `service` token.
        workspaces:
          type: array
          description: The token's bound workspace, permission-filtered to the principal's live reach, with the principal's
            current `workspaceRole`.
          items:
            $ref: '#/components/schemas/WorkspaceReach'
      example:
        id: usr_4f1a8c2e
        type: user
        email: producer@example.com
        name: Dana Producer
        workspaces:
        - workspaceId: ws_2b9d7a1f
          workspaceRole: admin
    WorkspacePlan:
      type: string
      description: The workspace's current plan tier (mirrors the product's plan names).
      enum:
      - free
      - creator
      - studio
      - enterprise
    Workspace:
      type: object
      description: "A workspace the token can act on, with the principal's current role. The internal workspaceId is renamed\
        \ to `workspaceId` at the boundary and never leaks; likewise workspaceRole \u2192 `workspaceRole`."
      required:
      - id
      - name
      - workspaceRole
      - createdAt
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          description: The workspace's display name.
        slug:
          type: string
          description: URL-friendly workspace handle, where one exists.
        workspaceRole:
          $ref: '#/components/schemas/WorkspaceRole'
        plan:
          $ref: '#/components/schemas/WorkspacePlan'
        apiAccess:
          type: boolean
          description: Whether the public API is enabled for this workspace's plan (`checkFeatureAccess`). When `false`, `/v1`
            resource calls return `403 feature_not_available`.
        createdAt:
          type: string
          format: date-time
          description: When the workspace was created (ISO-8601; epoch serialized at the boundary).
      example:
        id: ws_2b9d7a1f
        name: Paradigm Pictures
        slug: paradigm
        workspaceRole: admin
        plan: studio
        apiAccess: true
        createdAt: '2025-11-02T09:14:00.000Z'
