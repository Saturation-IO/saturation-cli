      tags:
      - Contacts
      summary: List contacts
      description: 'List the workspace''s contacts. Paginated. Supports `expand=documents,transactions` (permission-projected,
        an empty/partial expanded array means "not-readable-or-absent", indicated by the response''s `truncated` flag). Legacy
        parity note: the contact filter set is intentionally narrower than legacy. The high-value facets are kept (`q`, `type`,
        `tags`/`tagMode`, `track1099`, `hasTaxId`); legacy origin / linked-user / start-work facets are not ported, and the
        full tax / bank numbers are never filterable or returned (only the display-safe `taxIdLast4` / `hasTaxId` hints).
        Deep, saved filters belong to a `view` ().'
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/order'
      - $ref: '#/components/parameters/contactExpand'
      - $ref: '#/components/parameters/withCount'
      - $ref: '#/components/parameters/view'
      - name: q
        in: query
        required: false
        description: Free-text search over name / company / email.
        schema:
          type: string
      - name: type
        in: query
        required: false
        description: Filter by contact type. Comma-separate for an IN set.
        schema:
          type: string
          example: contractor
      - name: tags
        in: query
        required: false
        description: Comma-separated tag handles to filter by.
        schema:
          type: string
      - name: tagMode
        in: query
        required: false
        description: How `tags` combine.
        schema:
          type: string
          enum:
          - any
          - all
          - none
          default: any
      - name: track1099
        in: query
        required: false
        description: Only contacts tracked (or not) for 1099 reporting.
        schema:
          type: boolean
      - name: hasTaxId
        in: query
        required: false
        description: Only contacts that do (or do not) have a tax id on file.
        schema:
          type: boolean
      - name: includeDeleted
        in: query
        required: false
        schema:
          type: boolean
          default: false
