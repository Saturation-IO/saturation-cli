      - $ref: '#/components/schemas/DocumentCollection'
    DocumentAssignmentsCollection:
      type: object
      description: The set of typed targets a document is currently assigned to (single-reference v1). Not paginated, bounded
        by the number of target kinds.
      required:
      - data
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DocumentTargetRef'
      examples:
      - data:
        - kind: transaction
          id: txn_8f2a1c9e
        - kind: purchaseOrder
          id: po_3d77
    DocumentCreateMetadata:
      type: object
      description: Client-supplied metadata for a drop. Sent as the `metadata` part of a `multipart/form-data` upload alongside
        the `file` part. Server-owned fields (`status`, `workspaceId`, `uploaderId`, `contentHash`, timestamps) are NOT accepted,
        supplying one returns `422 field_read_only`.
      additionalProperties: false
      properties:
        name:
          type: string
          description: Display name. Defaults to the uploaded file's name when omitted.
        description:
          type: string
          description: Optional free-text description.
        folderId:
          allOf:
          - $ref: '#/components/schemas/Id'
          description: "Folder to drop into (`fld_\u2026`). Omit for the workspace root."
        assignTo:
          description: Optional target(s) to assign atomically with the drop. Accepts a single `{ kind, id }` or an array.
            In v1 every target must be a DISTINCT kind (one reference per kind); multiple same-kind targets return `400 validation`.
            If any target fails validation / permission / tenant checks, the whole request fails 4xx and NO document (and
            no orphan blob) is created.
          oneOf:
          - $ref: '#/components/schemas/DocumentTargetRef'
          - type: array
            items:
              $ref: '#/components/schemas/DocumentTargetRef'
            minItems: 1
      examples:
      - name: vendor-invoice-0425.pdf
        folderId: fld_9c2d
        assignTo:
          kind: transaction
          id: txn_8f2a1c9e
    DocumentCreateRequest:
      type: object
      description: The `multipart/form-data` drop body. `file` is the raw bytes; `metadata` is a JSON part serialized as `DocumentCreateMetadata`.
      required:
      - file
      additionalProperties: false
      properties:
        file:
          type: string
          format: binary
          description: The document bytes to upload.
        metadata:
          $ref: '#/components/schemas/DocumentCreateMetadata'
    DocumentUpdateRequest:
      type: object
      description: Rename / move / re-describe a document. Only client-writable fields are accepted; naming a server-owned
        field (e.g. `status`, `workspaceId`, `contentHash`) returns `422 field_read_only`. Assignments are changed via `/assign`
        and `/unassign`, never here.
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          description: New display name.
        description:
          type:
          - string
          - 'null'
          description: New description (null to clear).
        folderId:
          description: "Move to this folder (`fld_\u2026`), or null to move to the workspace root."
          anyOf:
          - allOf:
            - $ref: '#/components/schemas/Id'
          - type: 'null'
      examples:
      - name: vendor-invoice-april.pdf
        folderId: fld_9c2d
    DocumentAssignRequest:
      type: object
      description: 'Assign a dropped document to a typed target. Idempotent when re-assigning to the SAME id (200 no-op).
        If that kind''s reference is already set to a DIFFERENT id, returns `409 already_assigned` unless `replace: true`
        (an explicit move).'
      required:
      - target
      additionalProperties: false
      properties:
        target:
          $ref: '#/components/schemas/DocumentTargetRef'
        replace:
          type: boolean
          default: false
          description: When `true`, an existing same-kind assignment to a different id is replaced (an explicit move) instead
            of returning `409 already_assigned`.
      examples:
      - target:
          kind: purchaseOrder
          id: po_3d77
        replace: false
    DocumentUnassignRequest:
      type: object
      description: Remove a document's assignment to a typed target. Idempotent, a `200` no-op when the document is not assigned
        to that target.
      required:
      - target
      additionalProperties: false
      properties:
        target:
          $ref: '#/components/schemas/DocumentTargetRef'
      examples:
      - target:
          kind: transaction
          id: txn_8f2a1c9e
