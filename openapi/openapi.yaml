    PurchaseOrder:
      type: object
      description: A purchase order. `projectId` is `null` when it is not assigned to a project. `status` is read-only and
        changes through named actions.
      required:
      - id
      - workspaceId
      - status
      - createdAt
      - updatedAt
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        workspaceId:
          $ref: '#/components/schemas/Id'
        projectId:
          description: "The project (`prj_\u2026`) this PO is assigned to, or `null` when it is an unassigned workspace-level\
            \ purchase order."
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        number:
          type:
          - string
          - 'null'
          description: Human-facing PO number (e.g. `PO-0042`). Free text; filterable by exact match.
        title:
          type:
          - string
          - 'null'
          description: Short PO title. This is the field that `q` search matches against.
        status:
          $ref: '#/components/schemas/PurchaseOrderStatus'
        contactId:
          type:
          - string
          - 'null'
          description: "The vendor contact (`con_\u2026`). Setting it marks the contact as a vendor for this PO."
        budgetLineId:
          type:
          - string
          - 'null'
          description: "The budget line (`bud_\u2026`) this PO is charged against."
        date:
          type:
          - string
          - 'null'
          format: date
          description: PO date (ISO-8601 `YYYY-MM-DD`).
        serviceStartAt:
          type:
          - string
          - 'null'
          format: date
          description: First service date for this PO (ISO-8601 `YYYY-MM-DD`).
        serviceEndAt:
          type:
          - string
          - 'null'
          format: date
          description: Last service date for this PO (ISO-8601 `YYYY-MM-DD`).
        notes:
          type:
          - string
          - 'null'
          description: Free-text notes.
        sort:
          type:
          - number
          - 'null'
          description: Client-controlled display ordering key within the project.
        createdById:
          type:
          - string
          - 'null'
          description: "The principal that created the PO (`usr_\u2026`). Server-owned, read-only."
        total:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Sum of item amounts in the PO currency. Read-only.
        createdAt:
          type: string
          format: date-time
          description: ISO-8601 creation timestamp.
        updatedAt:
          type: string
          format: date-time
          description: ISO-8601 last-update timestamp.
        items:
          type: array
          description: Present only when `expand=items`. The PO line items.
          items:
            $ref: '#/components/schemas/PurchaseOrderItem'
        contact:
          description: Present only when `expand=contact`. Includes the vendor when you can read it.
          oneOf:
          - $ref: '#/components/schemas/Contact'
          - type: 'null'
        transactions:
          type: array
          description: Present only when `expand=transactions`. Includes linked transactions you can read.
          items:
            $ref: '#/components/schemas/Transaction'
        documents:
          type: array
          description: Present only when `expand=documents`. Includes assigned documents you can read.
          items:
            $ref: '#/components/schemas/Document'
        paymentRequests:
          type: array
          description: Present only when `expand=paymentRequests`. Includes linked payment requests you can read.
          items:
            $ref: '#/components/schemas/PaymentRequestBase'
        payments:
          type: array
          description: Present only when `expand=payments`. Includes linked sent payments you can read.
          items:
            $ref: '#/components/schemas/PaymentBase'
        budgetLine:
          description: Present only when `expand=budgetLine`. The charged budget line.
          oneOf:
          - $ref: '#/components/schemas/BudgetLine'
          - type: 'null'
        activity:
          description: Present only when `expand=activity`. Current live conditions using the same vocabulary as the product
            Activity column.
          oneOf:
          - $ref: '#/components/schemas/PurchaseOrderActivitySummary'
          - type: 'null'
        summary:
          description: Financial summary. Included on a single-PO read and available on lists with `expand=summary`.
          oneOf:
          - $ref: '#/components/schemas/PurchaseOrderSummary'
          - type: 'null'
      examples:
      - id: po_8f2a1c9e
        workspaceId: ws_3b1
        projectId: prj_demo
        number: PO-0042
        title: Camera package rental
        status: pending
        contactId: con_77a
        budgetLineId: bud_5510
        date: '2026-05-20'
        serviceStartAt: '2026-05-21'
        serviceEndAt: '2026-05-24'
        notes: Net-30
        sort: 1000
        createdById: usr_aa1
        total:
          amount: 152900
          currency: USD
        createdAt: '2026-05-18T14:02:11.000Z'
        updatedAt: '2026-05-20T09:31:00.000Z'
