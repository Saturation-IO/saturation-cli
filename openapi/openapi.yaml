      description: "Create or update a purchase-order line item. Item writes are allowed only while the parent PO `status\
        \ \u2208 {draft, rejected}`; otherwise `409 po_invalid_status`. `id` and `purchaseOrderId` are server-owned."
      additionalProperties: false
      properties:
        lineNumber:
          type:
          - integer
          - 'null'
        description:
          type:
          - string
          - 'null'
        budgetLineId:
          type:
          - string
          - 'null'
        qty:
          type:
          - number
          - 'null'
        unit:
          type:
          - string
          - 'null'
        rate:
          type:
          - integer
          - 'null'
          format: int64
        amount:
          type:
          - integer
          - 'null'
          format: int64
          description: "Optional. When omitted, the server calculates `qty \xD7 rate`. An inconsistent value returns `validation`."
        sort:
          type:
          - number
          - 'null'
      examples:
      - description: Alexa Mini LF body
        budgetLineId: bud_5510
        qty: 5
        unit: day
        rate: 25000
    PurchaseOrderList:
      type: object
      description: A paginated page of purchase orders.
      required:
      - data
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrder'
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
        count:
          type: integer
          description: Total matching items; present only when `withCount=true` was requested.
        truncated:
          type: boolean
          description: True when permission filtering or expansion returned fewer than `limit` items for this page.
    PurchaseOrderItemList:
      type: object
      description: A page of purchase-order line items.
      required:
      - data
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrderItem'
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
        count:
          type: integer
          description: Total matching items; present only when `withCount=true` was requested.
        truncated:
          type: boolean
          description: True when permission filtering or expansion returned fewer than `limit` items for this page.
    SearchKind:
      type: string
      description: 'The entity kinds the public Search can match in v1. `rate-pack-item` and `project` are deliberately NOT
        searchable in v1 and would each require additional work; treat as deferred. Note: `contacts` are workspace-level only
        (no project association), so a project-scoped token never matches them, see `SearchResponse.searchedTypes`.'
      enum:
      - transactions
      - documents
      - contacts
      - budget-lines
      - purchase-orders
      examples:
      - transactions
    SearchHit:
      type: object
      description: One ranked, mixed-type search result. Carries just enough to render a Search row and to re-fetch the full
        object by `{kind, id}`; `score` lets a client threshold weak matches. Every hit has passed the in-query permission
        / project-visibility filter, so the result set never contains a row the token cannot read.
      required:
      - kind
      - id
      - label
      - score
      additionalProperties: false
      properties:
        kind:
          $ref: '#/components/schemas/SearchKind'
        id:
          allOf:
          - $ref: '#/components/schemas/Id'
          description: "Canonical id of the matched entity (`txn_\u2026`, `doc_\u2026`, `con_\u2026`, `bud_\u2026`, `po_\u2026\
            `). Combine with `kind` to fetch the full object from its resource route."
        label:
          type: string
          description: The human title of the matched entity, exactly as it reads in the UI (e.g. a transaction description,
            a document name, a contact display title, a budget-line account label, a purchase-order title).
          examples:
          - Panavision Camera Package
        snippet:
          type: string
          description: The matched text fragment that produced the hit (the field the text similarity fired on). Absent when
            the matched text is identical to `label`.
          examples:
          - Invoice 4471, Panavision rental
        score:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 'Similarity of the match in `[0, 1]` (higher is closer). Results are returned in a stable order: highest
            score first, with equal scores tiebroken on `(kind, id)`.'
          examples:
          - 0.62
    SearchResponse:
      type: object
      description: 'A page of mixed-type Search results. `data` is returned in a stable order: highest score first, with equal
        scores tiebroken on `(kind, id)`. `searchedTypes` echoes which kinds were actually queried so partial coverage is
        visible and never a silent empty.'
      required:
      - data
      - searchedTypes
      additionalProperties: false
      properties:
        data:
          type: array
          description: The ranked hits for this page, capped at the request `limit`.
          items:
            $ref: '#/components/schemas/SearchHit'
        nextCursor:
          allOf:
          - $ref: '#/components/schemas/NextCursor'
          description: The canonical cursor for the next page. Encodes the mint-time `q` + `types` + sort; replaying it with
            a changed `q`/`types` returns `400 cursor_invalid`. Absent/null when there are no more results.
          examples:
          - eyJzIjowLjYyLCJrIjoidHJhbnNhY3Rpb25zIiwiaWQiOiJ0eG5fOGYyYSJ9
        count:
          type: integer
          description: Total matching hits; present only when `withCount=true`.
        truncated:
          type: boolean
          description: '`true` when the page returned fewer than `limit` results because the permission / project-visibility
            filter removed matches you cannot read. Keep paging with `nextCursor`.'
        searchedTypes:
          type: array
          description: "The kinds that were actually searched for this request, computed as `requested \u2229 supported \u2229\
            \ authorized`. A requested kind is dropped here (not silently returned empty) when it is not searchable in v1,\
            \ or when the token's permission scope fully denies it, e.g. a project-scoped token drops `contacts` (workspace-level\
            \ only, never project-visible). Compare against your requested `types` to detect partial coverage."
          items:
            $ref: '#/components/schemas/SearchKind'
          examples:
          - - transactions
            - documents
            - budget-lines
    TransactionSource:
      type: string
      description: Where the record came from, a closed enum of the four rails. `journal` is the manual entry that replaces
        the legacy "actual"; the other three are sourced rails whose core fields the rail owns and the public API treats as
        read-only.
      enum:
      - journal
      - plaid
      - saturation_pay
      - saturation_credit
      examples:
      - journal
    TransactionType:
      type: string
      description: What kind of money movement. The underlying column is open, so a new rail never forces a re-migration;
        the API publishes it as an **extensible enum**, the canonical PascalCase values below are documented, autocompletable
        and client-validatable, but an unknown value is still accepted on write and echoed on read (never coerced or rejected).
        Every writer (Plaid, Sat Pay/Credit banking, Stripe Treasury/Issuing, manual journals) emits this one canonical vocabulary.
        A `?type=` filter matches a row's stored value verbatim.
      x-extensible-enum: true
      enum:
      - SaturationPCard
      - ACH
      - Cash
      - Check
      - CreditCard
      - Deposit
      - ETransfer
      - Invoice
      - Projection
      - TimeCard
      - Wire
      - Withdrawal
      examples:
      - CreditCard
    TransactionJournalType:
      type: string
      description: The subset of `type` values that may be set on a `journal` create/patch (the human/journal family). Rail-only
        types (`SaturationPCard`, `Deposit`, `Withdrawal`) arrive via their rail and cannot be journaled. Casing is preserved
        exactly (PascalCase). Unknown values are rejected on the journal-create body only (input validation), never on stored/returned
        values elsewhere.
      enum:
      - Invoice
      - Projection
      - Cash
      - Check
      - Wire
      - ACH
      - CreditCard
      - TimeCard
      - ETransfer
      examples:
      - Invoice
    TransactionStatus:
      type: string
      description: Where the record is in life, a CLOSED 7-value public enum. `posted` means money moved (unifies bank "settled"
        and expense "paid"). Refunds and disputes are surfaced via the derived `isReversal=true` flag, never as a status.
        Not every status is reachable for every `source`, see `statusReachability` on the collection and the `status_unreachable_for_source`
        (409) error.
      enum:
      - unpaid
      - pending
      - posted
      - void
      - needs_review
      - projected
      - rejected
      examples:
      - posted
    ExchangeRateSource:
      type: string
      description: Origin of the `exchangeRate` on a sourced multi-currency row. Published as an extensible enum, the documented
        members are below, but an unknown value is still accepted and echoed.
      x-extensible-enum: true
      enum:
      - bank
      - api
      - user
      examples:
      - bank
    TransactionExpandKey:
      type: string
      description: "Allowed `expand` keys for transactions (typed allow-list, depth \u2264 2). An unknown or too-deep key\
        \ returns `400 expand_invalid` (all-or-nothing). Expanded arrays are permission-projected, so empty/partial means\
        \ \"not-readable-or-absent\"."
      enum:
      - contact
      - documents
      - itemized
      - account
      - purchaseOrder
      - itemized.account
      examples:
      - itemized.account
    TransactionSortField:
      type: string
      description: Sortable fields for the transactions list. A non-unique field appends `,id` as the tiebreaker. Default
        sort is `timestamp` `desc`.
      enum:
      - timestamp
      - amount
      - status
      - type
      - description
      - createdAt
      - updatedAt
      default: timestamp
      examples:
      - timestamp
    TransactionItem:
      type: object
      description: An itemized line of a transaction. When a transaction `isItemized`, coding moves from `transaction.budgetLineId`
        onto these items. Items soft-delete (for unsplit recovery); a deleted item is never returned.
      additionalProperties: false
      required:
      - id
      - lineNumber
      - amount
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/Id'
          description: "Stable item identifier (`txi_\u2026`)."
          examples:
          - txi_4a1b2c3d
        lineNumber:
          type: string
          description: Fractional-index line number, server-assigned so itemization order is consistent with auto-itemize.
          examples:
          - '1'
        description:
          type:
          - string
          - 'null'
          description: Free-text line description.
        budgetLineId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
          description: "Budget line this item is coded to (`bud_\u2026`)."
        fringeId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
          description: Fringe applied to this item, if any.
        qty:
          type:
          - number
          - 'null'
          description: Quantity (units of `unit`).
          examples:
          - 3
        unit:
          type:
          - string
          - 'null'
          description: Unit label (e.g. `Day`, `Hour`, `Flat`).
          examples:
          - Day
        rate:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
          description: Per-unit rate as money (minor units + currency).
        amount:
          $ref: '#/components/schemas/Money'
        overtime:
          type:
          - boolean
          - 'null'
          description: TimeCard, line is overtime.
        taxable:
          type:
          - boolean
          - 'null'
          description: TimeCard, line is taxable.
        nonTaxable:
          type:
          - boolean
          - 'null'
          description: TimeCard, line is non-taxable.
        account:
          description: Present only when `expand=itemized.account`; the budget account the item's budget line resolves to.
            permission-projected.
          oneOf:
          - $ref: '#/components/schemas/TransactionAccountRef'
          - type: 'null'
    TransactionItemCreate:
      type: object
      description: Body for creating one transaction item. `lineNumber` is server-assigned.
      additionalProperties: false
      required:
      - amount
      properties:
        description:
          type: string
        budgetLineId:
          $ref: '#/components/schemas/Id'
        fringeId:
          $ref: '#/components/schemas/Id'
        qty:
          type: number
        unit:
          type: string
        rate:
          $ref: '#/components/schemas/Money'
        amount:
          $ref: '#/components/schemas/Money'
        overtime:
          type: boolean
        taxable:
          type: boolean
        nonTaxable:
          type: boolean
    TransactionItemPatch:
      type: object
      description: Partial update of an item. All fields optional; `id`, `lineNumber` and tenant keys are server-owned and
        rejected with `422 field_read_only` if named.
      additionalProperties: false
      minProperties: 1
      properties:
        description:
          type:
          - string
          - 'null'
        budgetLineId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        fringeId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        qty:
          type:
          - number
          - 'null'
        unit:
          type:
          - string
          - 'null'
        rate:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        amount:
          $ref: '#/components/schemas/Money'
        overtime:
          type:
          - boolean
          - 'null'
        taxable:
          type:
          - boolean
          - 'null'
        nonTaxable:
          type:
          - boolean
          - 'null'
    TransactionAccountRef:
      type: object
      description: Lean budget-account reference inlined by `expand=account` / `itemized.account`.
      additionalProperties: false
      required:
      - id
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          examples:
          - Camera
        code:
          type:
          - string
          - 'null'
          description: Friendly account code, if any.
          examples:
          - '1200'
    Transaction:
      type: object
      description: The unified financial record (no separate "actuals"). One shape covers manual journals and every sourced
        rail; the three orthogonal dimensions `source` / `type` / `status` are exposed as three independent fields. Money
        is always integer minor units + `currency`; timestamps are ISO-8601.
      additionalProperties: false
      required:
      - id
      - source
      - status
      - isReversal
      - amount
      - timestamp
      - isItemized
      - actualized
      - createdAt
      - updatedAt
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/Id'
          description: "Stable transaction identifier (`txn_\u2026`)."
          examples:
          - txn_8f2a1c9e
        source:
          $ref: '#/components/schemas/TransactionSource'
        sourceId:
          type:
          - string
          - 'null'
          description: Opaque external source link reference for a sourced row (the rail's own id); `null` for journals. Not
            a joinable resource; the transaction record is itself the source of truth for reads.
        type:
          anyOf:
          - $ref: '#/components/schemas/TransactionType'
          - type: 'null'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        isReversal:
          type: boolean
          description: 'DERIVED (no stored column): `true` when the row''s internal state is a refund or dispute. Lets a consumer
            ask for "money-back events" after refund/dispute left the `status` vocabulary.'
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          type:
          - string
          - 'null'
          description: ISO-4217 currency (also carried inside `amount`). Surfaced top-level for convenience and filtering.
          minLength: 3
          maxLength: 3
          examples:
          - USD
        exchangeRate:
          type:
          - number
          - 'null'
          description: Sourced multi-currency rows, rate to the workspace base currency.
        exchangeRateSource:
          oneOf:
          - $ref: '#/components/schemas/ExchangeRateSource'
          - type: 'null'
        timestamp:
          type: string
          format: date-time
          description: When the money movement occurred (ISO-8601).
          examples:
          - '2026-05-20T14:03:00.000Z'
        description:
          type:
          - string
          - 'null'
        merchant:
          type:
          - string
          - 'null'
          description: Rail-supplied merchant name (read-only on sourced rows).
        logoUrl:
          type:
          - string
          - 'null'
          format: uri
          description: Rail-supplied merchant logo, if any.
        category:
          type:
          - string
          - 'null'
          description: Rail-supplied category, if any.
        sourceLast4:
          type:
          - string
          - 'null'
          description: Last 4 of the funding instrument on a sourced row (read-only).
        sourceName:
          type:
          - string
          - 'null'
          description: Human label of the source account/card (read-only on sourced rows).
        number:
          type:
          - string
          - 'null'
          description: Document/check/invoice number.
        ref:
          type:
          - string
          - 'null'
          description: Free-text external reference.
        payId:
          type:
          - string
          - 'null'
          description: Saturation Pay payment id, when applicable.
        notes:
          type:
          - string
          - 'null'
          description: User notes (always writable, any source).
        contactId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
          description: Assigned contact (vendor/crew/payee).
        projectId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
          nullable: true
          description: "Owning project (`prj_\u2026`), or `null` when the transaction is unassigned (workspace-level). Settable\
            \ via create/patch to assign, reassign, or unassign the row."
        budgetLineId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
          description: Budget line coding when NOT itemized. When `isItemized=true`, coding lives on `items[]` and this is
            `null`.
        fringeId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        isItemized:
          type: boolean
          description: '`true` once the row has items; flips automatically on first item create and back on last item delete.'
        actualized:
          type: boolean
          description: Whether this transaction contributes to a budget's ACTUAL phase. Only `actualized=true` rows count
            toward actuals. Birth value follows the workspace auto-actualize setting at create time; writable thereafter via
            PATCH on any source.
        purchaseOrderId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
          description: "Linked purchase order, if any (`po_\u2026`)."
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        contact:
          description: Present when `expand=contact`. Lean contact ref; null if not readable.
          type:
          - object
          - 'null'
        documents:
          description: Present when `expand=documents`. permission-projected document refs.
          type: array
          items:
            type: object
        items:
          type: array
          description: Present when `expand=itemized`. The itemized lines.
          items:
            $ref: '#/components/schemas/TransactionItem'
        account:
          description: Present when `expand=account`. Lean budget-account ref; null if absent.
          oneOf:
          - $ref: '#/components/schemas/TransactionAccountRef'
          - type: 'null'
        purchaseOrder:
          description: Present when `expand=purchaseOrder`. Lean PO ref; null if none/unreadable.
          type:
          - object
          - 'null'
    TransactionJournalCreate:
      type: object
      description: "Body for creating a JOURNAL transaction. `source` is forced to `journal`, naming any sourced source returns\
        \ `422 source_not_postable` (sourced rows arrive via their rail). Server-owned fields (`id`, `sourceId`, `isReversal`,\
        \ `createdAt`, `updatedAt`, tenant keys) are NOT writable. The chosen `status` is validated against the status \xD7\
        \ source reachability matrix \u2192 `409 status_unreachable_for_source`."
      additionalProperties: false
      required:
      - type
      - amount
      - timestamp
      properties:
        type:
          $ref: '#/components/schemas/TransactionJournalType'
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
          description: ISO-4217 currency (alternative to embedding it in `amount`).
          minLength: 3
          maxLength: 3
        timestamp:
          type: string
          format: date-time
        status:
          allOf:
          - $ref: '#/components/schemas/TransactionStatus'
          description: Defaults to `posted`. Must be reachable for `journal`.
        description:
          type: string
        projectId:
          allOf:
          - $ref: '#/components/schemas/Id'
          description: "Optional project assignment (`prj_\u2026` id or slug). Omit to create a workspace-level (unassigned)\
            \ transaction; a named project that does not resolve returns `404 not_found`."
        contactId:
          $ref: '#/components/schemas/Id'
        budgetLineId:
          allOf:
          - $ref: '#/components/schemas/Id'
          description: Coding (omit when the row will be itemized).
        fringeId:
          $ref: '#/components/schemas/Id'
        number:
          type: string
        ref:
          type: string
        notes:
          type: string
        actualized:
          type: boolean
          description: Optional override of the actualization birth value. Omit and the workspace auto-actualize setting decides;
            set explicitly to force it.
    TransactionPatch:
      type: object
      description: "Partial update. Writability is driven by a `source \u2192 {readonly, writable}` allow-list. Assignment\
        \ fields (`projectId`, `contactId`, `budgetLineId`, `fringeId`, `notes`, `number`, `ref`, `actualized`) are writable\
        \ on ANY source. `projectId` is an assignment field - a `prj_\u2026` id or slug moves the transaction to that project,\
        \ and `null` unassigns it back to the workspace level. Core fields (`amount`, `currency`, `timestamp`, `type`, `status`,\
        \ `merchant`, `sourceLast4`, `sourceName`) are writable ONLY on `journal`; naming one on a sourced row returns `422\
        \ field_read_only`. Server-owned fields (`id`, `source`, `sourceId`, `isReversal`, `isItemized`, `createdAt`, `updatedAt`)\
        \ are never writable. A `status` change is checked against the reachability matrix."
      additionalProperties: false
      minProperties: 1
      properties:
        projectId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
          description: "Assign, reassign, or unassign the transaction. A `prj_\u2026` id or slug moves it to that project;\
            \ `null` unassigns it back to the workspace level. Writable on any source."
        contactId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        budgetLineId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        fringeId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        notes:
          type:
          - string
          - 'null'
        number:
          type:
          - string
          - 'null'
        ref:
          type:
          - string
          - 'null'
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
          minLength: 3
          maxLength: 3
        timestamp:
          type: string
          format: date-time
        type:
          $ref: '#/components/schemas/TransactionType'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        description:
          type:
          - string
          - 'null'
        merchant:
          type:
          - string
          - 'null'
        sourceLast4:
          type:
          - string
          - 'null'
        sourceName:
          type:
          - string
          - 'null'
        actualized:
          type: boolean
          description: Whether this transaction contributes to a budget's ACTUAL phase. Writable on any source.
    TransactionBatchCreate:
      type: object
      description: "Bulk JOURNAL import. Each entry is a `TransactionJournalCreate`; `source` is forced to `journal` on every\
        \ row. Over the per-request cap \u2192 `413 batch_too_large`. Pair with an `Idempotency-Key` header for safe retries."
      additionalProperties: false
      required:
      - transactions
      properties:
        transactions:
          type: array
          minItems: 1
          maxItems: 500
          description: The journal transactions to create. Cap is 500 per request.
          items:
            $ref: '#/components/schemas/TransactionJournalCreate'
    TransactionCollection:
      type: object
      description: A paginated page of transactions plus disclosure metadata.
      additionalProperties: false
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
        count:
          type: integer
          description: Total matching rows; present only when `withCount=true`.
        truncated:
          type: boolean
          description: True when a permission/expand under-fetch bounded the page short of `limit`.
        statusReachability:
          $ref: '#/components/schemas/StatusReachabilityMatrix'
    TransactionItemCollection:
      type: object
      description: The itemized lines of a transaction.
      additionalProperties: false
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TransactionItem'
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
        count:
          type: integer
          description: Total matching rows; present only when `withCount=true`.
        truncated:
          type: boolean
          description: True when a permission/expand under-fetch bounded the page short of `limit`.
    TransactionStats:
      type: object
      description: Aggregate count + summed amount for a filter set (permission/project-scoped, honoring the same filter vocabulary
        as the list). `amount` is money in minor units; sum a single `currency` filter for a meaningful total across mixed-currency
        ledgers.
      additionalProperties: false
      required:
      - total
      - amount
      properties:
        total:
          type: integer
          description: Number of matching transactions.
          examples:
          - 142
        amount:
          $ref: '#/components/schemas/Money'
    TransactionTypes:
      type: object
      description: The distinct `type` values the token can actually see (permission/project-filtered, never the raw workspace-wide
        set), for building dropdowns. Casing is preserved per family.
      additionalProperties: false
      required:
      - data
      properties:
        data:
          type: array
          description: Distinct visible `type` values.
          items:
            $ref: '#/components/schemas/TransactionType'
          examples:
          - - CreditCard
            - Invoice
            - TimeCard
    StatusReachabilityMatrix:
      type: object
      description: The status x source reachability matrix the API owns and enforces. Maps each `source` to the subset of
        the 7 statuses it can legitimately reach. Setting an unreachable status on create/patch returns `409 status_unreachable_for_source`
        with the allowed set echoed in the error. Published so integrators can pre-validate.
      additionalProperties:
        type: array
        items:
          $ref: '#/components/schemas/TransactionStatus'
      examples:
      - journal:
        - posted
        - void
        - projected
        plaid:
        - pending
        - posted
        - void
        - needs_review
        saturation_pay:
        - unpaid
        - pending
        - posted
        - void
        - rejected
        saturation_credit:
        - pending
        - posted
        - void
        - needs_review
        - rejected
    UsageSource:
      type: string
      description: 'The activity origin: `api` = public-API requests, `agent` = agent runs, `document` = document extraction.
        Lets you view API and agent usage together or split them out.'
      enum:
      - api
      - agent
      - document
    UsageGroupBy:
      type: string
      description: The rollup dimension. `operation` = per templated operation/route, `token` = per API token, `agent` = per
        agent, `source` = per `api|agent|document`, `day`/`hour` = per time bucket. Drives both the grouping and the `key`
        shape of each returned row.
      enum:
      - operation
      - token
      - agent
      - source
      - day
      - hour
    UsageBucketGranularity:
      type: string
      description: The time-bucket width of a rollup row's `bucket`. `hour` is available for short windows; `day` for longer
        ones. Present on every row so the client knows the bucket's span.
      enum:
      - hour
      - day
    UsageOperationClass:
      type: string
      description: The pricing class an event falls under. Most API classes price to zero; only AI-backed operations incur
        credits. The value is an open string; the documented v1 members are listed. Used both as the `?operationClass` filter
        and as a row dimension.
      examples:
      - api.read
      - api.write
      - agent.run
      - document.extract
    UsageCreditEntryKind:
      type: string
      description: The kind of usage-credit entry. The usage/credits view reports `consumed` settlement debits (negative `amount`);
        `grant` / `purchase` rows are the positive top-ups the balance nets against. `adjustment` is a manual correction.
      enum:
      - consumed
      - grant
      - purchase
      - adjustment
    UsageRollupRow:
      type: object
      description: One pre-aggregated usage row (never a single usage event). The shape is uniform across `groupBy` values;
        the active dimension is echoed in `key` / `keyKind` so the same array renders any grouping. Counts, latency, error
        rate, and rate-limit hits are request metrics; `credits` is the settled usage-credit total.
      additionalProperties: false
      required:
      - workspaceId
      - keyKind
      - key
      - source
      - bucket
      - bucketGranularity
      - count
      - errorRate
      - rateLimitHits
      - credits
      properties:
        workspaceId:
          allOf:
          - $ref: '#/components/schemas/Id'
          description: "The workspace the rollup belongs to (`ws_\u2026`)."
        projectId:
          allOf:
          - $ref: '#/components/schemas/Id'
          description: "The project this row is attributed to (`prj_\u2026`), present on project-scoped rows and when grouping\
            \ retains project attribution. Absent for workspace-wide rows."
        keyKind:
          $ref: '#/components/schemas/UsageGroupBy'
        key:
          type: string
          description: "The active grouping dimension's value: a templated operation (`GET /v1/.../budget/lines`) for `operation`,\
            \ a `tok_\u2026` id for `token`, an agent id for `agent`, an `api|agent|document` for `source`, or an ISO-8601\
            \ bucket start for `day`/`hour`."
          examples:
          - GET /v1/budget/lines
        keyLabel:
          type: string
          description: A human-friendly label for `key` when one exists (e.g. a token's name). Absent when `key` is already
            self-describing.
        source:
          $ref: '#/components/schemas/UsageSource'
        operationClass:
          allOf:
          - $ref: '#/components/schemas/UsageOperationClass'
          description: The metering namespace this row aggregates, when split by operation class.
        bucket:
          type: string
          format: date-time
          description: ISO-8601 start of the row's time bucket (epoch values serialized at the boundary).
          examples:
          - '2026-05-27T00:00:00Z'
        bucketGranularity:
          $ref: '#/components/schemas/UsageBucketGranularity'
        count:
          type: integer
          description: Number of recorded events in this row.
          minimum: 0
          examples:
          - 1842
        latencyP50:
          type: integer
          description: Median request latency in milliseconds for this row. A performance metric, not a billing value; absent
            for rows whose source has no per-request latency (e.g. some agent rows).
          minimum: 0
          examples:
          - 38
        latencyP95:
          type: integer
          description: 95th-percentile request latency in milliseconds for this row. A performance metric, not a billing value.
          minimum: 0
          examples:
          - 211
        errorRate:
          type: number
          format: float
          description: Fraction of events in this row that returned a non-2xx status, `0`, `1`. Drives the error-trend chart.
          minimum: 0
          maximum: 1
          examples:
          - 0.012
        rateLimitHits:
          type: integer
          description: Number of `429` responses in this row. Drives the rate-limit-trend chart.
          minimum: 0
          examples:
          - 3
        credits:
          type: integer
          description: Settled **usage credits** for this row. `0` for most reads and writes; only AI-backed operations incur
            credits.
          examples:
          - 0
    UsageRollupResponse:
      type: object
      description: A page of usage rollup rows for the requested window and grouping, plus the resolved query window and pagination
        fields. All rows are limited to what the caller has permission to see.
      additionalProperties: false
      required:
      - data
      - window
      - groupBy
      properties:
        data:
          type: array
          description: The rollup rows for this page.
          items:
            $ref: '#/components/schemas/UsageRollupRow'
        window:
          $ref: '#/components/schemas/UsageWindow'
        groupBy:
          $ref: '#/components/schemas/UsageGroupBy'
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
        count:
          type: integer
          description: Total matching rollup rows for the window; present only when `withCount=true`.
        truncated:
          type: boolean
          description: True when permission filtering reduced the page below `limit`.
    UsageWindow:
      type: object
      description: The resolved time window the rollups cover, echoes the effective `from`/`to` after defaulting and validation,
        so a client that omitted them knows what it got. The window is capped (see `range_too_large`).
      additionalProperties: false
      required:
      - from
      - to
      properties:
        from:
          type: string
          format: date-time
          description: Inclusive start of the window (ISO-8601).
          examples:
          - '2026-05-01T00:00:00Z'
        to:
          type: string
          format: date-time
          description: Exclusive end of the window (ISO-8601).
          examples:
          - '2026-05-28T00:00:00Z'
    UsageCreditRow:
      type: object
      description: One **usage-credit** entry for the window, from the usage-credit ledger. This is the authoritative billing
        record. Balance is computed by summing ledger amounts, not stored as a separate row.
      additionalProperties: false
      required:
      - workspaceId
      - entryKind
      - amount
      - source
      - createdAt
      properties:
        workspaceId:
          allOf:
          - $ref: '#/components/schemas/Id'
          description: "The workspace the debit belongs to (`ws_\u2026`)."
        entryKind:
          $ref: '#/components/schemas/UsageCreditEntryKind'
        amount:
          type: integer
          description: Usage-credit delta for this settlement row, in whole usage credits. Negative for a `consumed` debit.
            Usage credits are a billing unit count, not a `Money` value.
          examples:
          - -1200
        balanceAfter:
          type: integer
          description: The usage-credit balance immediately after this entry, when available. Informational; the authoritative
            balance is the sum of all settled ledger amounts.
          examples:
          - 48800
        source:
          $ref: '#/components/schemas/UsageSource'
        sourceId:
          type: string
          description: The idempotency key for this entry, formed as `{periodStart}:{operationClass}`, so a re-run updates
            the same entry instead of double-charging.
          examples:
          - 2026-05-01T00:00:00Z:agent.run
        operationClass:
          $ref: '#/components/schemas/UsageOperationClass'
        featureContext:
          type: object
          description: Aggregation metadata for this settlement row (period / operationClass / source), echoed for reconciliation.
            Opaque map.
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
          description: When the settlement debit was written (ISO-8601; epoch serialized at the boundary).
          examples:
          - '2026-05-28T03:00:00Z'
    UsageCreditsResponse:
      type: object
      description: 'The usage-credit burn for the window: the individual entries plus a summed total and the resulting balance,
        from the usage-credit ledger.'
      additionalProperties: false
      required:
      - data
      - window
      - totalCredits
      properties:
        data:
          type: array
          description: The settlement rows in the window, newest first.
          items:
            $ref: '#/components/schemas/UsageCreditRow'
        window:
          $ref: '#/components/schemas/UsageWindow'
        totalCredits:
          type: integer
          description: Net usage credits over the window, the sum of settled ledger amounts across the returned rows (negative
            = net burn). The authoritative billing total.
          examples:
          - -3400
        balance:
          type: integer
          description: The workspace's current usage-credit balance, computed as the sum of all settled ledger amounts (never
            a stored balance row).
          examples:
          - 46600
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
        count:
          type: integer
          description: Total matching settlement rows for the window; present only when `withCount=true`.
        truncated:
          type: boolean
          description: True when permission filtering reduced the page below `limit`.
    UsageOperationRow:
      type: object
      description: 'One per-operation breakdown row: a templated operation/route with its volume, latency, error/rate-limit
        trend and settled usage credits. Like `UsageRollupRow` but always keyed by operation and always carrying its `operationClass`
        and `source`.'
      additionalProperties: false
      required:
      - operation
      - operationClass
      - source
      - count
      - errorRate
      - rateLimitHits
      - credits
      properties:
        operation:
          type: string
          description: The templated operation/route, never the populated path, so account codes stay out of logs and cardinality
            stays bounded.
          examples:
          - POST /v1/transactions
        operationClass:
          $ref: '#/components/schemas/UsageOperationClass'
        source:
          $ref: '#/components/schemas/UsageSource'
        count:
          type: integer
          description: Number of recorded events for this operation in the window.
          minimum: 0
          examples:
          - 920
        latencyP50:
          type: integer
          description: Median latency in milliseconds. A performance metric, not a billing value.
          minimum: 0
          examples:
          - 52
        latencyP95:
          type: integer
          description: 95th-percentile latency in milliseconds. A performance metric, not a billing value.
          minimum: 0
          examples:
          - 318
        errorRate:
          type: number
          format: float
          description: Fraction of non-2xx responses, `0`, `1`.
          minimum: 0
          maximum: 1
          examples:
          - 0.004
        rateLimitHits:
          type: integer
          description: Number of `429` responses for this operation.
          minimum: 0
          examples:
          - 0
        credits:
          type: integer
          description: Settled **usage credits** for this operation.
          examples:
          - 0
    UsageOperationsResponse:
      type: object
      description: The per-operation usage breakdown for the window, limited to what the caller has permission to see.
      additionalProperties: false
      required:
      - data
      - window
      properties:
        data:
          type: array
          description: The per-operation rows for this page, highest volume first.
          items:
            $ref: '#/components/schemas/UsageOperationRow'
        window:
          $ref: '#/components/schemas/UsageWindow'
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
        count:
          type: integer
          description: Total matching rollup rows for the window; present only when `withCount=true`.
        truncated:
          type: boolean
          description: True when permission filtering reduced the page below `limit`.
    WebhookEvent:
      type: string
      description: Events available for webhook subscriptions. Purchase-order events use the status the order entered. Only
        listed events are delivered.
      enum:
      - transaction.created
      - transaction.updated
      - budget.changed
      - purchaseOrder.created
      - purchaseOrder.pending
      - purchaseOrder.approved
      - purchaseOrder.rejected
      - purchaseOrder.actualizing
      - purchaseOrder.paid
      - purchaseOrder.void
      - document.created
      - document.assigned
      - document.unassigned
      - document.deleted
      - incentive.added
      - pack.installed
      - pack.uninstalled
      examples:
      - transaction.created
    WebhookPayloadStyle:
      type: string
      description: Deliver the record type and id. Fetch the record to read its current fields.
      enum:
      - thin
      default: thin
    WebhookDeliveryStatus:
      type: string
      description: Outcome of a single delivery attempt. `pending` = queued or mid-retry, not yet terminal. `success` = the
        endpoint returned a 2xx within the timeout. `failed` = a non-2xx, timeout, or transport error (retried with exponential
        backoff). `blocked` = the target failed the SSRF guard at delivery time (re-validated even if it passed registration).
        `dropped` = permission re-resolution at delivery denied the subscription's owning identity, so the event was withheld
        fail-closed.
      enum:
      - pending
      - success
      - failed
      - blocked
      - dropped
    WebhookExpand:
      type: string
      description: Allowed `expand` key for a webhook subscription (typed allow-list; an unknown or too-deep key returns `400
        expand_invalid`). `subscriber` inlines the owning identity (user or workspace account) whose current access filters
        this subscription's events.
      enum:
      - subscriber
      examples:
      - subscriber
    WebhookSubscriber:
      type: object
      description: The owning identity a subscription is bound to (the `expand=subscriber` target). A subscription dies with
        this identity and only ever receives events that identity can read.
      additionalProperties: false
      required:
      - kind
      - id
      properties:
        kind:
          type: string
          description: Whether the subscription is owned by a user token or a workspace account.
          enum:
          - user
          - serviceIdentity
        id:
          $ref: '#/components/schemas/Id'
        displayName:
          type: string
          description: Human-readable label for the owning identity.
          examples:
          - Zapier integration
    Webhook:
      type: object
      description: An outbound webhook subscription. Workspace-scoped, optionally narrowed to one project; it delivers the
        events in `events[]` to `url` over signed, SSRF-guarded HTTPS. The `secret` is returned exactly once, in the create
        response, and never on any read.
      additionalProperties: false
      required:
      - id
      - url
      - events
      - payloadStyle
      - isActive
      - workspaceId
      - createdAt
      - updatedAt
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/Id'
          description: "Subscription identifier (`whk_\u2026`)."
          examples:
          - whk_5c1a9e02
        url:
          type: string
          format: uri
          description: HTTPS destination for deliveries. Always validated by the SSRF guard on create and on any URL change;
            private / loopback / link-local / cloud-metadata / IPv6-mapped / decimal-octal-hex / internal-DNS targets are
            rejected.
          examples:
          - https://hooks.example.com/saturation
        events:
          type: array
          description: The subscribed event types. Closed enum ().
          minItems: 1
          items:
            $ref: '#/components/schemas/WebhookEvent'
        payloadStyle:
          $ref: '#/components/schemas/WebhookPayloadStyle'
        isActive:
          type: boolean
          description: Whether the subscription currently receives deliveries. Toggled via PATCH; a webhook continues to exist
            while paused.
        workspaceId:
          allOf:
          - $ref: '#/components/schemas/Id'
          description: "The workspace the subscription belongs to (`ws_\u2026`). Server-owned; not client-writable."
        projectId:
          allOf:
          - $ref: '#/components/schemas/Id'
          description: "Optional project scope (`prj_\u2026`). When set, the subscription only receives that project's events.\
            \ Server-owned after create; not changeable via PATCH."
        subscriber:
          $ref: '#/components/schemas/WebhookSubscriber'
        lastDeliveryAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp of the most recent delivery attempt for this subscription, for a quick health glance.
            Absent until the first delivery (including a `ping`).
        lastDeliveryStatus:
          allOf:
          - $ref: '#/components/schemas/WebhookDeliveryStatus'
          description: Outcome of the most recent delivery attempt. Absent until the first delivery. Inspect the full history
            via `GET.../deliveries`.
        createdAt:
          type: string
          format: date-time
          description: ISO-8601 creation timestamp.
        updatedAt:
          type: string
          format: date-time
          description: ISO-8601 last-update timestamp.
    WebhookWithSecret:
      description: The create response. Identical to `Webhook` but additionally carries the signing `secret` this one time
        only, store it now; it can never be read again. Rotating the secret means recreating the subscription.
      allOf:
      - $ref: '#/components/schemas/Webhook'
      - type: object
        required:
        - secret
        properties:
          secret:
            type: string
            description: The HMAC signing secret. Returned exactly once, here. Used to verify `X-Saturation-Signature` on
              every delivery. Never echoed on GET / list / PATCH.
            examples:
            - whsec_3f9b2a7c8d4e1a05
    WebhookCreate:
      type: object
      description: Create-a-subscription request body (Zod allow-list). Server-owned fields (`id`, `workspaceId`, owning identity,
        `isActive`, `createdAt`, `updatedAt`) are not accepted; naming one returns `422 field_read_only`.
      additionalProperties: false
      required:
      - url
      - events
      properties:
        url:
          type: string
          format: uri
          description: HTTPS-only destination. Rejected with `400 webhook_https_required` if not HTTPS, and `422 webhook_url_blocked`
            / `409 webhook_url_invalid_ssrf` if it resolves to a blocked address.
          examples:
          - https://hooks.example.com/saturation
        events:
          type: array
          description: One or more event types to subscribe to.
          minItems: 1
          items:
            $ref: '#/components/schemas/WebhookEvent'
        secret:
          type: string
          description: Optional signing secret. If omitted, the server generates one and returns it once in the create response.
          minLength: 16
          maxLength: 256
        payloadStyle:
          $ref: '#/components/schemas/WebhookPayloadStyle'
        projectId:
          allOf:
          - $ref: '#/components/schemas/Id'
          description: "Optional project scope (`prj_\u2026`). Set only at create; the subscription then receives just that\
            \ project's events. Fixed thereafter (not PATCH-able)."
    WebhookUpdate:
      type: object
      description: PATCH a subscription (explicit Zod allow-list). Only these fields are writable. Tenant keys (`workspaceId`
        / `projectId`), the owning identity, and `secret` are server-owned, naming any of them returns `422 field_read_only`
        (fail-loud, never a silent strip). A `url` change re-runs the SSRF guard.
      additionalProperties: false
      minProperties: 1
      properties:
        url:
          type: string
          format: uri
          description: New HTTPS destination. Re-validated by the SSRF guard.
          examples:
          - https://hooks.example.com/saturation/v2
        events:
          type: array
          description: Replacement event set.
          minItems: 1
          items:
            $ref: '#/components/schemas/WebhookEvent'
        payloadStyle:
          $ref: '#/components/schemas/WebhookPayloadStyle'
        isActive:
          type: boolean
          description: Pause (`false`) or resume (`true`) deliveries.
    WebhookDelivery:
      type: object
      description: One delivery attempt of an event to a subscription, recorded for debugging. The `id` is stable across retries
        of the same delivery; a redelivery gets a new `id`.
      additionalProperties: false
      required:
      - id
      - event
      - status
      - entityKind
      - entityId
      - payloadStyle
      - attempts
      - occurredAt
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/Id'
          description: "Delivery identifier (`whd_\u2026`). Stable across retries; used as the dedupe key."
          examples:
          - whd_9a02c1e5
        event:
          $ref: '#/components/schemas/WebhookEvent'
        status:
          $ref: '#/components/schemas/WebhookDeliveryStatus'
        entityKind:
          type: string
          description: The kind of entity the event concerns (e.g. `transaction`, `budget`, `purchaseOrder`, `document`).
          examples:
          - transaction
        entityId:
          allOf:
          - $ref: '#/components/schemas/Id'
          description: The id of the entity the event concerns (what the consumer re-fetches).
          examples:
          - txn_8f2a1c9e
        payloadStyle:
          $ref: '#/components/schemas/WebhookPayloadStyle'
        requestUrl:
          type: string
          format: uri
          description: The validated, IP-pinned URL the delivery was sent to.
          examples:
          - https://hooks.example.com/saturation
        responseStatus:
          type: integer
          description: HTTP status the subscriber returned, when a connection was made. Absent for `blocked` / `dropped`.
          examples:
          - 200
        attempts:
          type: integer
          description: 1-based count of delivery attempts made so far (deliveries retry with exponential backoff).
          minimum: 1
          examples:
          - 1
        nextRetryAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp of the next scheduled retry. Present only while `pending` and more attempts remain;
            absent once the delivery is terminal (`success` / `failed` / `blocked` / `dropped`).
        error:
          type: string
          description: Failure detail for `failed` / `blocked` / `dropped` (e.g. SSRF rejection reason, permission drop, or
            transport error). Absent on `success`.
        occurredAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp of when the originating event occurred.
        deliveredAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp of the terminal attempt. Absent while `pending`.
    WebhookEventPayload:
      type: object
      description: The body sent to a subscriber. Fetch the record in `data` to read its current fields. Verify `X-Saturation-Signature`
        with the timestamp and raw body. Use `X-Saturation-Delivery-Id` to ignore duplicate deliveries.
      additionalProperties: false
      required:
      - id
      - event
      - workspaceId
      - occurredAt
      - data
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/Id'
          description: "The stable delivery id (`whd_\u2026`); the dedupe key for at-least-once delivery."
        event:
          $ref: '#/components/schemas/WebhookEvent'
        workspaceId:
          allOf:
          - $ref: '#/components/schemas/Id'
          description: "The workspace the event belongs to (`ws_\u2026`)."
        projectId:
          allOf:
          - $ref: '#/components/schemas/Id'
          description: Present (and required) for project-scoped event kinds, so the consumer can build the fetch URL.
        occurredAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp of the originating change.
        data:
          type: object
          description: The record to fetch.
          additionalProperties: false
          required:
          - kind
          - id
          properties:
            kind:
              type: string
              description: The entity kind (e.g. `transaction`, `budget`, `purchaseOrder`, `document`).
              examples:
              - transaction
            id:
              allOf:
              - $ref: '#/components/schemas/Id'
              description: The entity id to re-fetch.
              examples:
              - txn_8f2a1c9e
    WebhookCollection:
      type: object
      description: A paginated page of webhook subscriptions.
      additionalProperties: false
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Webhook'
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
        count:
          type: integer
          description: Total matching items; present only when `withCount=true` was requested.
        truncated:
          type: boolean
          description: True when a permission/expand under-fetch bounded the page short of `limit`.
    WebhookDeliveryCollection:
      type: object
      description: A paginated page of delivery attempts for one subscription.
      additionalProperties: false
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDelivery'
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
        count:
          type: integer
          description: Total matching items; present only when `withCount=true` was requested.
        truncated:
          type: boolean
          description: True when a permission/expand under-fetch bounded the page short of `limit`.
