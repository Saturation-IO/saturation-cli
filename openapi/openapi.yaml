  /search:
    get:
      operationId: search_workspace
      summary: Search (workspace scope)
      tags:
      - Search
      description: Ranked, mixed-type search across the workspace, permission-filtered so a token never sees results from
        projects it cannot read. Each hit is `{kind, id, label, snippet, score}`; fetch the full object by `{kind, id}`. `searchedTypes`
        echoes which kinds were actually queried so partial coverage is visible, never a silent empty (a project-scoped token,
        for example, drops `contacts`, they are workspace-level only). Results are returned in a stable order so pagination
        is consistent.
      parameters:
      - name: q
        in: query
        required: true
        description: The search query. 1 to 500 characters.
        schema:
          type: string
          minLength: 1
          maxLength: 500
        examples:
          panavision:
            value: Panavision
      - name: types
        in: query
        required: false
        description: "Comma-separated subset of kinds to search; omit to search every supported kind. The response always\
          \ echoes `searchedTypes` (`requested \u2229 supported \u2229 authorized`), so a kind with no text index or a fully-denied\
          \ scope is dropped (not silently empty). An unrecognized kind fails validation (`fieldErrors.types`)."
        style: form
        explode: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/SearchKind'
        examples:
          twoKinds:
            value: transactions,documents
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: A ranked page of mixed-type hits plus the echoed `searchedTypes`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
              examples:
                panavision:
                  summary: Workspace search for "Panavision"
                  value:
                    data:
                    - kind: transactions
                      id: txn_8f2a1c9e
                      label: Panavision Camera Package
                      snippet: Invoice 4471, Panavision rental
                      score: 0.62
                    - kind: documents
                      id: doc_4b71e0aa
                      label: Panavision quote.pdf
                      score: 0.41
                    nextCursor: eyJzIjowLjQxLCJrIjoiZG9jdW1lbnRzIiwiaWQiOiJkb2NfNGI3MSJ9
                    searchedTypes:
                    - transactions
                    - documents
                    - budget-lines
                    - purchase-orders
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
  /projects/{projectId}/search:
    get:
      operationId: search_project
      summary: Search (project scope)
      tags:
      - Search
      description: 'The project-scoped variant of search: every kind is restricted to this `projectId` (intersected with the
        token''s visibility), so results can only come from that project. As at workspace scope, the permission / view-access
        filter is applied before ranking and cap, `searchedTypes` is echoed, and results are returned in a stable order so
        pagination is consistent. `contacts` are workspace-level only and so are never returned at project scope; they are
        dropped from `searchedTypes`. A `projectId` the token cannot read returns `404 not_found` (same shape as exists-but-unauthorized,
        so existence never leaks).'
      parameters:
      - $ref: '#/components/parameters/projectId'
      - name: q
        in: query
        required: true
        description: The search query. 1 to 500 characters.
        schema:
          type: string
          minLength: 1
          maxLength: 500
        examples:
          panavision:
            value: Panavision
      - name: types
        in: query
        required: false
        description: Comma-separated subset of kinds to search; omit to search every supported kind. Echoed back as `searchedTypes`.
          `contacts` is never searched at project scope (workspace-level only) and is dropped from `searchedTypes` even if
          requested.
        style: form
        explode: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/SearchKind'
        examples:
          twoKinds:
            value: transactions,budget-lines
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: A ranked page of mixed-type hits scoped to this project, plus `searchedTypes`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
              examples:
                panavision:
                  summary: Project search for "Panavision"
                  value:
                    data:
                    - kind: budget-lines
                      id: bud_2c80fa11
                      label: Camera Rental
                      snippet: Panavision Millennium DXL2 body
                      score: 0.55
                    - kind: transactions
                      id: txn_8f2a1c9e
                      label: Panavision Camera Package
                      score: 0.62
                    searchedTypes:
                    - transactions
                    - documents
                    - budget-lines
                    - purchase-orders
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
  /transactions:
    get:
      operationId: transactions_list
      tags:
      - Transactions
      summary: List transactions
      description: Flat, AND-composed list of the unified ledger for a workspace. Every returned row passes a request-derived
        permission `read` on `{kind:'Transaction', workspaceId, projectId}`; a row the token cannot read is never returned
        (enumeration-safe). Paginated (cap 100). `q` runs the text `similarity(description)` search. The page also echoes
        the `statusReachability` matrix.
      parameters:
      - name: projectId
        in: query
        description: "Filter by project (`prj_\u2026` id or slug). Use `none` for unassigned (workspace-level) transactions;\
          \ omit to return every transaction in the workspace."
        schema:
          type: string
      - name: source
        in: query
        description: Filter by rail. Comma-separated = IN.
        schema:
          $ref: '#/components/schemas/TransactionSource'
      - name: type
        in: query
        description: Filter by movement type (extensible enum). Comma-separated = IN.
        schema:
          type: string
      - name: status
        in: query
        description: Filter by status. Separate multiple values with commas.
        schema:
          $ref: '#/components/schemas/TransactionStatus'
      - name: isReversal
        in: query
        description: Closed boolean over the derived reversal set (refund and dispute states, plaid reversals). `true` = money-back
          events only.
        schema:
          type: boolean
      - name: contactId
        in: query
        description: Filter by assigned contact.
        schema:
          $ref: '#/components/schemas/Id'
      - name: budgetLineId
        in: query
        description: Filter by coded budget line (transaction-level coding).
        schema:
          $ref: '#/components/schemas/Id'
      - name: dateFrom
        in: query
        description: Inclusive lower bound on `timestamp` (ISO-8601). `dateFrom > dateTo` -> 400 invalid_date_range.
        schema:
          type: string
          format: date-time
      - name: dateTo
        in: query
        description: Inclusive upper bound on `timestamp` (ISO-8601).
        schema:
          type: string
          format: date-time
      - name: amountMin
        in: query
        description: Inclusive lower bound on `amount` in minor units.
        schema:
          type: integer
          format: int64
      - name: amountMax
        in: query
        description: Inclusive upper bound on `amount` in minor units.
        schema:
          type: integer
          format: int64
      - name: isItemized
        in: query
        description: Filter itemized (`true`) vs single-coded (`false`) transactions.
        schema:
          type: boolean
      - name: merchant
        in: query
        description: Filter by rail-supplied merchant name (case-insensitive substring match). A restored high-value legacy
          facet, useful for grouping sourced spend by vendor.
        schema:
          type: string
      - name: hasDocuments
        in: query
        description: 'Restore the high-value legacy "has attachments" facet, retargeted to the documents model: `true` returns
          only transactions with at least one assigned document, `false` only those with none. (Legacy `hasAttachments`; the
          underlying assignment model is the new `/documents` + assign surface.)'
        schema:
          type: boolean
      - name: q
        in: query
        description: Full-text search over `description`.
        schema:
          type: string
      - $ref: '#/components/parameters/transactionExpand'
      - $ref: '#/components/parameters/transactionSort'
      - $ref: '#/components/parameters/order'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/withCount'
      - $ref: '#/components/parameters/view'
      responses:
        '200':
          description: A page of transactions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionCollection'
              example:
                data:
                - id: txn_8f2a1c9e
                  source: plaid
                  sourceId: plx_991
                  type: CreditCard
                  status: posted
                  isReversal: false
                  amount:
                    amount: 152900
                    currency: USD
                  currency: USD
                  timestamp: '2026-05-20T14:03:00.000Z'
                  description: B&H Photo - camera rental
                  merchant: B&H Photo
                  contactId: con_4d5e
                  projectId: prj_films
                  budgetLineId: bud_camera
                  isItemized: false
                  purchaseOrderId: null
                  createdAt: '2026-05-20T14:05:00.000Z'
                  updatedAt: '2026-05-20T14:05:00.000Z'
                nextCursor: eyJ0cyI6MTY4
                statusReachability:
                  journal:
                  - posted
                  - void
                  - projected
                  plaid:
                  - pending
                  - posted
                  - void
                  - needs_review
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
    post:
      operationId: transactions_create
      tags:
      - Transactions
      summary: Create a journal transaction
      description: Create a manual (journal) transaction. `source` is forced to `journal`; a sourced `source` in the body
        -> `422 source_not_postable` (sourced rows arrive via their rail). The optional `projectId` body field assigns the
        row to a project (omit for a workspace-level / unassigned transaction). permission `create` with the request-derived
        `{kind:'Transaction', workspaceId, projectId}` subject. The `status` is validated against the status x source reachability
        matrix. Fires `transaction.created`. This billable create requires an `Idempotency-Key` header; replaying a key with
        a different body -> `409 idempotency_conflict`.
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: 'Required client-generated key (16-255 chars) for exactly-once creation. Retrying with the same key replays
          the original result (`Idempotency-Replayed: true`); the same key with a different body returns `409 idempotency_conflict`.
          Missing or too-short key returns `400 validation`.'
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
