                $ref: '#/components/schemas/WebhookWithSecret'
              example:
                id: whk_5c1a9e02
                url: https://hooks.example.com/saturation
                events:
                - transaction.created
                - transaction.updated
                - budget.changed
                payloadStyle: thin
                isActive: true
                workspaceId: ws_1a2b3c4d
                secret: whsec_3f9b2a7c8d4e1a05
                createdAt: '2026-05-28T12:00:00.000Z'
                updatedAt: '2026-05-28T12:00:00.000Z'
        '400':
