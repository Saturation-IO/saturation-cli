        not break clients.
      x-extensible-enum: true
      enum:
      - active
      - staged
      - archived
    Project:
      type: object
      description: "A project, the unit a budget, transactions, documents and the project-project Library hang off. Addressable\
        \ by canonical `id` (`prj_\u2026`) or by `slug` (the human handle, unique per workspace)."
      required:
      - id
      - slug
      - name
      - status
      - createdAt
      - updatedAt
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        slug:
          type: string
          description: The project's human handle (unique per workspace), accepted in the path as `/projects/{slugOrId}`.
            Mirrors the project handle shown in the UI.
          examples:
          - q3-feature-doc
        name:
          type: string
          description: Display name.
          examples:
          - Q3 Feature Doc
        emoji:
          type:
          - string
          - 'null'
          description: Optional emoji shown next to the project in the UI.
        image:
          type:
          - string
          - 'null'
          description: Optional cover image URL.
        status:
          $ref: '#/components/schemas/ProjectStatus'
        summary:
          type:
          - string
          - 'null'
          description: A short, generated 1-2 sentence description of the project.
        spaceId:
          description: The space (folder) this project belongs to, or `null` if ungrouped.
          anyOf:
          - allOf:
            - $ref: '#/components/schemas/Id'
          - type: 'null'
        createdAt:
          type: string
          format: date-time
          description: ISO-8601 creation timestamp (serialized from the internal epoch).
        updatedAt:
          type: string
          format: date-time
          description: ISO-8601 last-modified timestamp.
