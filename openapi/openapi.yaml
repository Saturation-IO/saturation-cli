  /documents:
    post:
      operationId: documents_drop
      tags:
      - Documents
      summary: Drop a document (optionally assign atomically)
      description: 'Upload ("drop") a document once. Optionally assign it to one or more typed targets in the same atomic
        call via `metadata.assignTo`, the 80% "receipt onto this transaction" case. Atomic: if any target fails validation,
        permission, or the cross-workspace check, the request fails 4xx and NO document row (and no orphan blob) is created.
        In v1, multiple targets must be DISTINCT kinds (one reference per kind). The assign permission gate is `update` on
        each target''s subject, not on the document.

        This is a billable create (it stores a blob and a document row). Accepts an optional `Idempotency-Key` header for
        safe retries; replaying the same key with a different body returns `409 idempotency_conflict`.'
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Optional client-generated key for safe retries of this billable drop. Replaying the same key with a different
          body returns `409 idempotency_conflict`.
        schema:
          type: string
      requestBody:
        required: true
        content:
