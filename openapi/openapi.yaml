  /projects:
    get:
      operationId: master-data_listProjects
      tags:
      - Projects
      summary: List projects
      description: 'List the workspace''s projects, permission-filtered to those the token can read. Paginated (cap-100).
        Soft-deleted projects are hidden unless `includeDeleted=true`. Legacy parity note: the project filter set is intentionally
        narrower than legacy. The high-value facets are kept (`status`, `spaceId`, `q`); the legacy `labels[]` project-label
        filter is NOT ported, Next has no project-label primitive (projects are grouped by `spaceId`, and per-entity tagging
        is the Library tag pool, not a project label). Deep, saved filters belong to a `view` (), not the query string.'
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/order'
      - $ref: '#/components/parameters/withCount'
      - name: status
        in: query
        required: false
        description: Filter by status. Separate multiple values with commas (for example, `active,archived`).
        schema:
          type: string
          example: active
      - name: spaceId
        in: query
        required: false
        description: Only projects filed under this space.
        schema:
          $ref: '#/components/schemas/Id'
      - name: q
        in: query
        required: false
        description: Free-text search over project name / slug.
        schema:
          type: string
      - name: includeDeleted
        in: query
        required: false
        description: Include soft-deleted projects (each carries a non-null `soft-delete timestamp`).
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: A page of projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
              example:
                data:
                - id: prj_8f2a1c9e
                  slug: q3-feature-doc
                  name: Q3 Feature Doc
                  emoji: "\U0001F3AC"
                  image: null
                  status: active
                  summary: A short documentary on Q3 features.
                  spaceId: spc_1a2b3c
                  createdAt: '2026-05-01T12:00:00Z'
                  updatedAt: '2026-05-20T09:30:00Z'
                nextCursor: eyJpZCI6InByal84ZjJhMWM5ZSJ9
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '429':
          $ref: '#/components/responses/Error429'
        '404':
          $ref: '#/components/responses/Error404'
    post:
      operationId: master-data_createProject
      tags:
      - Projects
      summary: Create a project
      description: Create a project in the workspace. Requires `create` on the `Project` subject (request-derived). Server-owned
        fields are rejected with `422 field_read_only`.
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: 'Required client-generated key (16-255 chars) for exactly-once creation. Retrying with the same key replays
          the original result (`Idempotency-Replayed: true`); the same key with a different body returns `409 idempotency_conflict`.
          Missing or too-short key returns `400 validation`.'
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
            example:
              name: Q3 Feature Doc
              emoji: "\U0001F3AC"
              spaceId: spc_1a2b3c
      responses:
        '201':
          description: The created project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              example:
                id: prj_8f2a1c9e
                slug: q3-feature-doc
                name: Q3 Feature Doc
                emoji: "\U0001F3AC"
                image: null
                status: active
                summary: null
                spaceId: spc_1a2b3c
                createdAt: '2026-05-29T10:00:00Z'
                updatedAt: '2026-05-29T10:00:00Z'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
