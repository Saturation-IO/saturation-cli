  /purchase-orders:
    get:
      operationId: purchase-orders_list
      summary: List purchase orders
      description: Lists purchase orders you can read. Use `projectId` to limit the list to one project or unassigned orders.
        Deleted orders are hidden unless `includeDeleted=true`.
      tags:
      - Purchase Orders
      parameters:
      - name: projectId
        in: query
        required: false
        description: "Filter by project. A `prj_\u2026` id or project slug returns only that project's purchase orders; `none`\
          \ returns unassigned (workspace-level) purchase orders; omitting it returns every purchase order in the workspace.\
          \ A named project that does not exist (or is not readable) returns `404 not_found`."
        schema:
          type: string
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/purchaseOrderSort'
      - $ref: '#/components/parameters/order'
      - $ref: '#/components/parameters/purchaseOrderExpand'
      - $ref: '#/components/parameters/withCount'
      - $ref: '#/components/parameters/view'
      - name: status
        in: query
        required: false
        description: Filter by current status.
        schema:
          $ref: '#/components/schemas/PurchaseOrderStatus'
      - name: contactId
        in: query
        required: false
        description: "Filter to POs whose vendor contact is this id (`con_\u2026`)."
        schema:
          type: string
      - name: budgetLineId
        in: query
        required: false
        description: "Filter to POs charged against this budget line (`bud_\u2026`)."
        schema:
          type: string
      - name: number
        in: query
        required: false
        description: Exact-match filter on the human-facing PO `number` (no text index on number).
        schema:
          type: string
      - name: q
        in: query
        required: false
        description: Free-text search. A text search index exists on `title` only, so `q` matches `title`; `number` is exact-match
          via the `number` filter.
        schema:
          type: string
      - name: includeDeleted
        in: query
        required: false
        description: Include soft-deleted purchase orders (`soft-delete timestamp` populated). Default `false`.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: A page of purchase orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderList'
              examples:
                page:
                  value:
                    data:
                    - id: po_8f2a1c9e
                      workspaceId: ws_3b1
                      projectId: prj_demo
                      number: PO-0042
                      title: Camera package rental
                      status: pending
                      contactId: con_77a
                      budgetLineId: bud_5510
                      date: '2026-05-20'
                      total:
                        amount: 152900
                        currency: USD
                      createdAt: '2026-05-18T14:02:11.000Z'
                      updatedAt: '2026-05-20T09:31:00.000Z'
                    nextCursor: eyJpZCI6InBvXzhmMmExYzllIn0
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
    post:
      operationId: purchase-orders_create
      summary: Create a purchase order
      description: Create a purchase order. The server forces `status='draft'` and sets `createdById`. Pass an optional `projectId`
        in the body to assign the PO to a project; omit it to create a workspace-level (unassigned) purchase order. Naming
        a server-owned field (`status`, `createdById`, `workspaceId`, any `flow*`/`activity*` column) returns `422 field_read_only`.
        Requires an `Idempotency-Key` header.
      tags:
      - Purchase Orders
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: 'Required client-generated key (16-255 chars) for exactly-once creation. Retrying with the same key replays
          the original result (`Idempotency-Replayed: true`); the same key with a different body returns `409 idempotency_conflict`.
          Missing or too-short key returns `400 validation`.'
        schema:
          type: string
      - $ref: '#/components/parameters/purchaseOrderExpand'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderCreate'
            examples:
              create:
                value:
                  number: PO-0042
                  title: Camera package rental
                  contactId: con_77a
                  budgetLineId: bud_5510
                  date: '2026-05-20'
                  items:
                  - description: Alexa Mini LF body
                    qty: 5
                    unit: day
                    rate: 25000
      responses:
        '201':
          description: The created purchase order (status `draft`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
              examples:
                created:
                  value:
                    id: po_8f2a1c9e
                    workspaceId: ws_3b1
                    projectId: prj_demo
                    number: PO-0042
                    title: Camera package rental
                    status: draft
                    contactId: con_77a
                    budgetLineId: bud_5510
                    date: '2026-05-20'
                    createdById: usr_aa1
                    createdAt: '2026-05-18T14:02:11.000Z'
                    updatedAt: '2026-05-18T14:02:11.000Z'
