                - id: rpk_2a9f
                  slug: iatse-local-871
                  name: IATSE Local 871
                  category: union
                  tags:
                  - union
                  - scripted
                  visibility: PUBLIC
                  isOwned: false
                  deprecated: false
                  enabled: true
                  latestVersion:
                    id: rpv_1
                    effectiveDate: '2026-01-01'
                    itemCount: 142
                nextCursor: eyJpZCI6InJwa18yYTlmIn0
