    DocumentExtractedField:
      type: object
      description: One structured field extracted from a document, paired with the platform's confidence in the value so a
        consumer can threshold low-confidence reads.
      required:
      - value
      additionalProperties: false
      properties:
        value:
          type:
          - string
          - 'null'
          description: The extracted value, serialized as a string (money values are decimal strings; dates are ISO-8601).
            Null when the field was detected as a key but no value could be read.
        confidence:
          type:
          - number
          - 'null'
          description: Extraction confidence in `[0,1]`, or null when the platform does not score this field.
          minimum: 0
          maximum: 1
      examples:
      - value: B&H Photo
        confidence: 0.95
    DocumentExtractedLineItem:
      type: object
      description: One line item extracted from a document (e.g. an invoice row). Money is integer minor units + currency,
        like everywhere else.
      additionalProperties: false
      properties:
        description:
          type:
          - string
          - 'null'
        amount:
          description: The line amount as money, when extracted.
          anyOf:
          - allOf:
            - $ref: '#/components/schemas/Money'
          - type: 'null'
        confidence:
          type:
          - number
          - 'null'
          description: Extraction confidence in `[0,1]` for this line.
          minimum: 0
          maximum: 1
    DocumentExtraction:
      type: object
      description: The structured fields extracted from a document, the replacement for the legacy per-attachment parsed-document
        payload. Available only once the document's `status` is `READY`. Read-only; the platform owns extraction. `fields`
        is a flat, open map of named extracted values (the named keys vary by `classification`, e.g. an invoice carries `invoiceNumber`/`vendorName`/`total`),
        each a `DocumentExtractedField` with a confidence score.
      required:
      - documentId
      - status
      - fields
      additionalProperties: false
      properties:
        documentId:
          allOf:
          - $ref: '#/components/schemas/Id'
          description: "The document this extraction belongs to (`doc_\u2026`)."
        status:
          $ref: '#/components/schemas/DocumentStatus'
        classification:
          type:
          - string
          - 'null'
          description: Fine-grained classification that determines which `fields` keys are present (e.g. `invoice`, `receipt`).
        coarseType:
          description: Coarse content category (mirrors `Document.coarseType`).
          anyOf:
          - allOf:
            - $ref: '#/components/schemas/DocumentCoarseType'
          - type: 'null'
        extractedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: ISO-8601 timestamp extraction completed, or null if not yet available.
        fields:
          type: object
          description: Flat map of extracted field name to its value + confidence. The set of keys depends on `classification`;
            unknown keys are allowed (open map) so new classifications never break the contract.
          additionalProperties:
            $ref: '#/components/schemas/DocumentExtractedField'
        lineItems:
          type: array
          description: Line items extracted from the document, when applicable (e.g. invoice rows). Absent for documents with
            no itemized content.
          items:
            $ref: '#/components/schemas/DocumentExtractedLineItem'
      examples:
      - documentId: doc_4b1f0a7c
        status: READY
        classification: invoice
        coarseType: financial
        extractedAt: '2026-05-28T14:03:40Z'
        fields:
          invoiceNumber:
            value: '4471'
            confidence: 0.98
          total:
            value: '1529.00'
            confidence: 0.91
        lineItems:
        - description: Camera body rental - 3 days
          amount:
            amount: 75000
            currency: USD
          confidence: 0.86
    DocumentCollection:
      type: object
