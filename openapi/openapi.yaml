    post:
      operationId: webhooks_create
      summary: Create a webhook subscription
      description: Register an outbound webhook. `manage`-gated. The `url` must be HTTPS and pass the SSRF guard at registration
        (private / loopback / link-local / cloud-metadata / IPv6-mapped / decimal-octal-hex / internal-DNS targets are rejected).
        A `secret` is generated when not supplied and returned in this response only, it never appears on any later read.
        Naming a server-owned field (`id`, `workspaceId`, owning identity, `isActive`) returns `422 field_read_only`.
