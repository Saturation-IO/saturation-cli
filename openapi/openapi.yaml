        cap, discount, jurisdiction, type, account number, tier pin). Source tracking is read-only. `appliedCreditCap` is
        integer MINOR units like all contract money (a $1,500,000 cap is 150000000; whole-currency amounts only - multiples
        of 100); null clears it. `rate` and `discountPercent` are percentages (30 = 30%).'
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        isApplied:
          type: boolean
        accountNumber:
          type: string
        incentiveType:
          type: string
          enum:
          - tax_credit
          - rebate
          - grant
        jurisdiction:
          type: string
        rate:
          type: number
          minimum: 0
          maximum: 100
        appliedCreditCap:
          type:
          - integer
          - 'null'
          minimum: 0
          multipleOf: 100
        discountPercent:
          type: number
          minimum: 0
          maximum: 100
        tierOverrideKey:
          type:
          - string
          - 'null'
