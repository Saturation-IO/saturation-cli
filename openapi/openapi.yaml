                  responseStatus: 200
                  attempts: 1
                  occurredAt: '2026-05-28T14:00:00.000Z'
                  deliveredAt: '2026-05-28T14:00:00.420Z'
                nextCursor: null
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A bearer token for the API. Create one in Saturation under Settings > Developers > API, then send it in
        the Authorization header as `Bearer <token>`. The token acts as you in the one workspace it was created in.
  parameters:
    projectId:
      name: projectId
      in: path
      required: true
      description: "Project identifier, accepts the canonical `id` (`prj_\u2026`) or the project `slug`."
      schema:
        type: string
    limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return on a page. Capped at 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a prior page's `nextCursor`. Encodes the mint-time filter + sort; replaying it against
        a changed filter or sort returns `400 cursor_invalid`. Stable under concurrent insert / soft-delete.
      schema:
        type: string
    sort:
      name: sort
      in: query
      required: false
      description: Field to sort by (replaces legacy `sortBy`). A non-unique sort field appends `,id` as the tiebreaker. Allowed
        fields are typed per resource.
      schema:
        type: string
    order:
      name: order
      in: query
      required: false
      description: Sort direction (replaces legacy `sortOrder`).
      schema:
        type: string
        enum:
        - asc
        - desc
        default: asc
    transactionSort:
      name: sort
      in: query
      required: false
      description: Field to sort the transactions list by. A non-unique field appends `,id` as the tiebreaker. Defaults to
        `timestamp` `desc`.
      schema:
        $ref: '#/components/schemas/TransactionSortField'
    purchaseOrderSort:
      name: sort
      in: query
      required: false
      description: Field to sort the purchase-order list by. A non-unique field appends `,id` as the tiebreaker.
      schema:
        $ref: '#/components/schemas/PurchaseOrderSort'
    view:
      name: view
      in: query
      required: false
      description: Replay a saved view (`?view={id}`), a named, persisted filter + shape bundle. The view's filter/sort/expand
        resolve first; any inline query params layer on top to refine. An unknown or unreadable view id returns `404 not_found`.
      schema:
        $ref: '#/components/schemas/Id'
    transactionExpand:
      name: expand
      in: query
      required: false
      description: "Comma list of related data to inline on transactions (depth \u2264 2). Unknown or too-deep key returns\
        \ `400 expand_invalid`."
      schema:
        type: array
        items:
          $ref: '#/components/schemas/TransactionExpandKey'
      style: form
      explode: false
    purchaseOrderExpand:
      name: expand
      in: query
      required: false
      description: "Comma list of related data to inline on a purchase order (depth \u2264 2). Unknown key returns `400 expand_invalid`."
      schema:
        type: array
        items:
          $ref: '#/components/schemas/PurchaseOrderExpand'
      style: form
      explode: false
    documentExpand:
      name: expand
      in: query
      required: false
      description: "Comma list of related data to inline on documents (depth \u2264 2). Unknown key returns `400 expand_invalid`."
      schema:
        type: array
        items:
          $ref: '#/components/schemas/DocumentExpand'
      style: form
      explode: false
    contactExpand:
      name: expand
      in: query
      required: false
      description: "Comma list of related data to inline on contacts (depth \u2264 2). Unknown key returns `400 expand_invalid`."
      schema:
        type: array
        items:
          $ref: '#/components/schemas/ContactExpand'
      style: form
      explode: false
    budgetLineExpand:
      name: expand
      in: query
      required: false
      description: "Comma list of related data to inline on budget lines (depth \u2264 2). Unknown or too-deep key returns\
        \ `400 expand_invalid`."
      schema:
        type: array
        items:
          $ref: '#/components/schemas/BudgetLineExpand'
      style: form
      explode: false
    libraryExpand:
      name: expand
      in: query
      required: false
      description: "Comma list of related data to inline on a project copy (depth \u2264 2). Unknown key returns `400 expand_invalid`."
      schema:
        type: array
        items:
          $ref: '#/components/schemas/LibraryExpand'
      style: form
      explode: false
    projectIncentiveExpand:
      name: expand
      in: query
      required: false
      description: "Comma list of related data to inline on a project incentive (depth \u2264 2). Unknown key returns `400\
        \ expand_invalid`."
      schema:
        type: array
        items:
          $ref: '#/components/schemas/ProjectIncentiveExpand'
      style: form
      explode: false
    ratePackExpand:
      name: expand
      in: query
      required: false
      description: Comma list of related data to inline on a workspace-source rate pack. Unknown key returns `400 expand_invalid`.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/RatePackExpand'
      style: form
      explode: false
    incentivePackExpand:
      name: expand
      in: query
      required: false
      description: Comma list of related data to inline on a workspace-source incentive pack. Unknown key returns `400 expand_invalid`.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/IncentivePackExpand'
      style: form
      explode: false
    projectRatePackExpand:
      name: expand
      in: query
      required: false
      description: Comma list of related data to inline on a project-installed rate pack. Unknown key returns `400 expand_invalid`.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/ProjectRatePackExpand'
      style: form
      explode: false
    webhookExpand:
      name: expand
      in: query
      required: false
      description: "Comma list of related data to inline on a webhook subscription (depth \u2264 2). Unknown key returns `400\
        \ expand_invalid`."
      schema:
        type: array
        items:
          $ref: '#/components/schemas/WebhookExpand'
      style: form
      explode: false
    viewDataExpand:
      name: expand
      in: query
      required: false
      description: "Comma list of related data to inline on resolved view rows (depth \u2264 2). The valid keys depend on\
        \ the view's `subjectType`, they are the same per-resource allow-list as the underlying resource (transactions, documents,\
        \ contacts or budget lines). An unknown or too-deep key for the resolved subject returns `400 expand_invalid`."
      schema:
        type: array
        items:
          type: string
      style: form
      explode: false
    withCount:
      name: withCount
      in: query
      required: false
      description: Opt in to a total `count` on the collection envelope. Off by default because counting is expensive. Valid
        on every list response, the canonical envelope always carries `count`.
      schema:
        type: boolean
        default: false
    usageFrom:
      name: from
      in: query
      required: false
      description: Inclusive start of the window (ISO-8601). Defaults to a recent window when omitted. The window is capped,
        an over-cap `from`/`to` span returns `400 range_too_large`; an inverted or unparseable range returns `400 invalid_date_range`.
      schema:
        type: string
        format: date-time
      example: '2026-05-01T00:00:00Z'
    usageTo:
      name: to
      in: query
      required: false
      description: Exclusive end of the window (ISO-8601). Defaults to now when omitted. `from` must be before `to`.
      schema:
        type: string
        format: date-time
      example: '2026-05-28T00:00:00Z'
    usageGroupBy:
      name: groupBy
      in: query
      required: false
      description: The rollup dimension. Defaults to `day`. The active dimension is echoed in each row's `keyKind` / `key`.
      schema:
        $ref: '#/components/schemas/UsageGroupBy'
    usageSource:
      name: source
      in: query
      required: false
      description: Filter to a single source (`api | agent | document`). Omit for the combined view across all three.
      schema:
        $ref: '#/components/schemas/UsageSource'
    usageOperationClass:
      name: operationClass
      in: query
      required: false
      description: Filter to a single operation class (e.g. `api.read`, `agent.run`).
      schema:
        $ref: '#/components/schemas/UsageOperationClass'
    usageTokenId:
      name: tokenId
      in: query
      required: false
      description: "Filter rollups to a single API token (`tok_\u2026`)."
      schema:
        $ref: '#/components/schemas/Id'
  responses:
    Error400:
      description: Bad request, `validation`, `cursor_invalid`, `expand_invalid`, `invalid_date_range`, `webhook_https_required`
        or `document_invalid_target_kind`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error401:
      description: Unauthenticated, `unauthenticated`, `invalid_token`, `missing_authorization` or `token_revoked` (expired,
        malformed, missing or revoked credentials).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error403:
      description: "Forbidden, `permission_revoked` (with a `requiredAbility` hint), `scope_exceeded`, `forbidden`, `feature_not_available`,\
        \ `role_ceiling_exceeded`, `token_revoked` or `document_assign_forbidden`. The principal's live ability \u2229 token\
        \ scopes does not permit the action."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error404:
      description: Not found, `not_found` (also returned for exists-but-unauthorized, so existence never leaks) or `document_target_not_found`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error409:
      description: Conflict, `account_path_ambiguous`, `idempotency_conflict`, `already_assigned`, `status_unreachable_for_source`,
        `po_invalid_status` or `webhook_url_invalid_ssrf`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error413:
      description: Payload / result too large, `budget_too_large` or `batch_too_large`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error422:
      description: Unprocessable entity, `field_read_only` (mass-assignment of a server-owned field), `source_not_postable`,
        `webhook_url_blocked` or `role_ceiling_exceeded`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error429:
      description: Rate limited, `rate_limited`. The response carries a `Retry-After` header. Rate-limit internals are not
        leaked.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error504:
      description: Gateway timeout, `budget_compute_timeout`. The budget engine did not return a computed result within the
        deadline; retry (the result may be cached on the next call).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Id:
      type: string
      description: "A stable, prefixed canonical identifier (e.g. `ws_\u2026`, `prj_\u2026`, `acc_\u2026`, `txn_\u2026`, `bud_\u2026\
        `, `po_\u2026`, `doc_\u2026`). The internal domain `address` is never exposed."
      examples:
      - txn_8f2a1c9e
    PublicResourceRef:
      type: object
      description: A typed reference to another public resource. The referenced row is included only when the caller can read
        it.
      required:
      - type
      - id
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - document
          - payment_request
          - payment
          - transaction
          - approval
        id:
          $ref: '#/components/schemas/Id'
    ErrorCode:
      type: string
      description: The closed set of stable, typed error codes returned at the `/v1` boundary. (The internal catalog is numeric;
        these public string codes live only inside the public-API envelope.)
      enum:
      - unauthenticated
      - invalid_token
      - missing_authorization
      - token_revoked
      - permission_revoked
      - scope_exceeded
      - forbidden
      - feature_not_available
      - upgrade_required
      - capacity_exceeded
      - approval_required
      - resource_locked
      - temporarily_unavailable
      - role_ceiling_exceeded
      - api_access_disabled
      - not_found
      - document_target_not_found
      - validation
      - cursor_invalid
      - expand_invalid
      - invalid_date_range
      - webhook_https_required
      - document_invalid_target_kind
      - range_too_large
      - account_path_ambiguous
      - account_code_ambiguous
      - budget_compute_stale
      - idempotency_conflict
      - already_assigned
      - status_unreachable_for_source
      - po_invalid_status
      - webhook_url_invalid_ssrf
      - legacy_fringe_unsupported
      - field_read_only
      - scenario_too_large
      - source_not_postable
      - webhook_url_blocked
      - document_assign_forbidden
      - budget_too_large
      - batch_too_large
      - rate_limited
      - signing_key_not_configured
      - internal_error
      - budget_compute_timeout
    Error:
      type: object
      description: 'The uniform error envelope. Only errors carry `success: false`; success responses are the bare resource
        or a `{ data, nextCursor? }` collection.'
      required:
      - success
      - code
      - message
      - requestId
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: false
          description: Always `false`. Present only on errors.
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: A human-readable, self-diagnosable description of the failure.
        requestId:
          type: string
          description: The id of the request that failed, quote it in support tickets and correlate with usage logs.
          examples:
          - req_3f9b2a7c
        fieldErrors:
          type: object
          description: 'Present on validation / mass-assignment failures: a map of input field name to a list of error messages
            for that field.'
          additionalProperties:
            type: array
            items:
              type: string
        requiredAbility:
          type: string
          description: 'Present on `permission_revoked` (403): the permission ability the caller is missing, expressed as
            `action:subject` (e.g. `update:Transaction`), so the failure is self-diagnosable.'
        retryAfter:
          type: integer
          description: 'Present on `rate_limited` (429): seconds to wait before retrying (mirrors the `Retry-After` header).'
        accessDecision:
          $ref: '#/components/schemas/ProductAccessDecision'
          description: Present when product access denied the operation. Route remediation by the typed reason, not by HTTP
            status alone.
    ProductAccessDecision:
      type: object
      description: Redacted product-access denial evidence. Internal workspace, principal, resource, idempotency, catalog,
        and subscription evidence is never exposed.
      required:
      - operationId
      - allowed
      - state
      - primary
      - remediations
      - resolvingPlanId
      additionalProperties: false
      properties:
        operationId:
          type: string
          minLength: 1
        allowed:
          type: boolean
        state:
          type: string
          enum:
          - allowed
          - warning
          - denied
          - indeterminate
        primary:
          type:
          - object
          - 'null'
          additionalProperties: false
          required:
          - kind
          - status
          - reason
          properties:
            kind:
              type: string
              enum:
              - principal
              - authority
              - policy
              - rollout
              - provider
              - entitlement
              - quota
            status:
              type: string
              enum:
              - warning
              - denied
              - indeterminate
            reason:
              type: string
              enum:
              - principal_unauthenticated
              - principal_expired
              - principal_suspended
              - resource_unreachable
              - permission_denied
              - resource_locked
              - approval_required
              - safety_restricted
              - rollout_disabled
              - delivery_unavailable
              - provider_unavailable
              - provider_ineligible
              - legal_restricted
              - plan_excluded
              - contract_restricted
              - subscription_restricted
              - quota_warning
              - quota_exhausted
              - quota_unknown
              - quota_reservation_required
              - dependency_unknown
            quotaId:
              type: string
              minLength: 1
            usage:
              type: integer
              minimum: 0
            limit:
              type: integer
              minimum: 0
        remediations:
          type: array
          items:
            type: string
            enum:
            - self_serve_upgrade
            - contact_billing_owner
            - contact_sales
            - buy_capacity
            - cleanup
            - authenticate
            - request_access
            - resolve_policy
            - wait_for_rollout
            - resolve_provider
            - recover_payment
            - reactivate_subscription
            - contact_support
            - renew_link
        currentPlanId:
          type: string
          enum:
          - free
          - pro
          - team
          - enterprise
        resolvingPlanId:
          type:
          - string
          - 'null'
          enum:
          - free
          - pro
          - team
          - enterprise
          - null
        correlationId:
          type: string
          minLength: 1
    Money:
      type: object
      description: A monetary amount as an integer count of the currency's minor units (e.g. cents) plus an explicit ISO-4217
        currency. Never a float.
      required:
      - amount
      - currency
      additionalProperties: false
      properties:
        amount:
          type: integer
          format: int64
          description: Amount in the currency's smallest unit (e.g. cents). May be negative.
          examples:
          - 152900
        currency:
          type: string
          description: ISO-4217 currency code.
          minLength: 3
          maxLength: 3
          examples:
          - USD
    NextCursor:
      type:
      - string
      - 'null'
      description: The canonical cursor field carried flat on every collection envelope. Opaque; pass it back as `cursor`
        to fetch the next page. `null` (or absent) on the last page. Encodes the mint-time filter + sort; replaying it against
        a changed filter/sort returns `400 cursor_invalid`.
      examples:
      - eyJpZCI6InR4bl84ZjJhMWM5ZSJ9
      - null
    PhaseType:
      type: string
      description: "The public budget-phase column type. This is the vocabulary. The internal value set is mapped at the API\
        \ boundary (`estimate\u2192regular`, `rollup\u2192variance`, `actual\u2192actual`, `committed\u2192committed`) and\
        \ never leaks into a response."
      enum:
      - estimate
      - actual
      - rollup
      - committed
      examples:
      - estimate
    BudgetLineKind:
      type: string
      description: The the row kind (the `type` column on a budget line). Accounts are NOT a separate table, an `account`
        row is a budget line with `kind=account`.
      enum:
      - account
      - line
      - subtotal
      - fringe
      - markup
      - credit
      - banner
    ComputedLineKind:
      type: string
      description: The narrowed kind that appears on a node in the computed whole-tree response. The computed response collapses
        the stored row kind to these four.
      enum:
      - account
      - line
      - credit
      - fringe
    BudgetLineExpand:
      type: string
      description: "Allowed `expand` keys for budget-line reads (comma-separated, depth \u2264 2). `contact` is a relation\
        \ expand; `account` projects classifier fields already inline on the row; `phases` adds the computed value matrix;\
        \ `phaseData` adds raw editable estimate phase data keyed by phase id; `sourceItem` dereferences the `sourceId` to\
        \ its library origin (or an explicit tombstone, never null). An unknown or too-deep key returns `400 expand_invalid`.\
        \ Legacy parity note: the legacy `lines.notes` expand is intentionally NOT ported, the note is now a plain-text `line.notes`\
        \ field always present inline on the line, so there is nothing to expand (the rich-text `NoteData` / `/budget/note`\
        \ resource is gone, see `BudgetLine.notes`)."
      enum:
      - phases
      - phaseData
      - contact
      - account
      - sourceItem
    TagMode:
      type: string
      description: How a multi-value `tags` filter composes. `any` = OR (default), `all` = AND, `none` = exclude any tagged
        row.
      enum:
      - any
      - all
      - none
      default: any
    FringeBreakdownEntry:
      type: object
      description: One contributing fringe within a computed PhaseValues, itemized for transparency.
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          description: Fringe label as it appears in the Library / on screen.
        amount:
          type: integer
          format: int64
          description: This fringe's contribution to the cell, in workspace-base minor units.
    PhaseValues:
      type: object
      description: The computed value matrix for one phase of one row (or the rolled-up subtotal on an account row). All amounts
        are integers in the workspace **base** currency's minor units; each contributing line is converted to base via its
        exchange rate before summing, so a computed value is never a mix of currencies. `combined` is the source of truth
        (`combined === amount`); clients must never re-sum.
      required:
      - base
      - overtime
      - fringe
      - fringeBreakdown
      - amount
      - combined
      - currency
      additionalProperties: false
      properties:
        base:
          type: integer
          format: int64
          description: Base amount (pre-overtime, pre-fringe), minor units of the base currency.
        overtime:
          type: integer
          format: int64
          description: Overtime amount, minor units of the base currency.
        fringe:
          type: integer
          format: int64
          description: Total fringe amount, minor units of the base currency.
        fringeBreakdown:
          type: array
          description: Itemized contributing fringes that sum to `fringe`.
          items:
            $ref: '#/components/schemas/FringeBreakdownEntry'
        amount:
          type: integer
          format: int64
          description: The computed amount for the node. `combined` mirrors this; it is the source of truth.
        combined:
          type: integer
          format: int64
          description: base + overtime + fringe, post-credit; the authoritative total for the cell. Always equal to `amount`.
            Never re-summed client-side, never a stored fallback.
        currency:
          type: string
          description: The workspace base ISO-4217 currency the computed value is normalized to.
          minLength: 3
          maxLength: 3
          examples:
          - USD
      examples:
      - base: 1000000
        overtime: 0
        fringe: 220000
        fringeBreakdown:
        - id: frg_pension
          name: Pension
          amount: 220000
        amount: 1220000
        combined: 1220000
        currency: USD
    BudgetPhase:
      type: object
      description: A budget phase, the column dimension of the budget matrix.
      required:
      - id
      - type
      - name
      - sort
      - isHidden
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        type:
          $ref: '#/components/schemas/PhaseType'
        name:
          type: string
          description: Phase name as shown on screen.
        alias:
          type:
          - string
          - 'null'
          description: Optional short alias for the phase column header.
        color:
          type:
          - string
          - 'null'
          description: Display color token for the phase column (never a hex literal in the UI).
        sort:
          type: integer
          description: Stable display order among phases.
        isHidden:
          type: boolean
          description: Whether the phase column is hidden in the UI.
      examples:
      - id: phs_estimate
        type: estimate
        name: Estimate
        alias: EST
        color: blue
        sort: 0
        isHidden: false
    BudgetLine:
      type: object
      description: A stored budget row. `code` is the (non-unique, possibly empty) account number; `path` is the coded account
        path used for friendly lookups. The internal `address` is never returned. Expand-only relations (`contact`, `account`,
        `phases`, `phaseData`, `sourceItem`) appear only when requested via `expand`.
      required:
      - id
      - kind
      - name
      - parentId
      - sort
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        code:
          type:
          - string
          - 'null'
          description: Account number (the friendly `accountId` classifier). Non-unique, may be empty.
          examples:
          - '1100'
        path:
          type:
          - string
          - 'null'
          description: Coded account path for friendly lookups (e.g. `1100/1110`). Never the address.
          examples:
          - 1100/1110
        kind:
          $ref: '#/components/schemas/BudgetLineKind'
        name:
          type: string
          description: Line description (the on-screen line name).
        parentId:
          $ref: '#/components/schemas/Id'
        depth:
          type: integer
          description: Depth in the account tree (root account = 0). Present on tree reads.
        sort:
          type: integer
          description: Stable display order among siblings.
        contactId:
          $ref: '#/components/schemas/Id'
        lineColor:
          type:
          - string
          - 'null'
          description: Display color token for the row.
        emoji:
          type:
          - string
          - 'null'
        notes:
          type:
          - string
          - 'null'
          description: 'Free-text note on the line, a single plain-text string. Legacy parity note: the legacy budget-line
            note was a rich `NoteData` object (TipTap `json`/`html`/`text`) managed through dedicated `/budget/note` endpoints;
            that shape and those endpoints are intentionally NOT ported. Notes are plain text on `line.notes`, read and written
            inline on the line itself, there is no separate note resource and no rich-text payload.'
        tagIds:
          type: array
          description: Tag ids attached to this line.
          items:
            $ref: '#/components/schemas/Id'
        subtotalSumAllAbove:
          type: boolean
          description: For `subtotal` rows, sum all rows above rather than the immediate group.
        subtotalIsBold:
          type: boolean
        markupAccountFilter:
          type:
          - string
          - 'null'
          description: For `markup` rows, the account filter the markup applies to.
        sourceId:
          description: Identifies the **workspace** library item this row was copied from (e.g. a credit source). Null when
            the row has no workspace-library origin. Dereference with `expand=sourceItem`.
          anyOf:
          - allOf:
            - $ref: '#/components/schemas/Id'
          - type: 'null'
        sourceIncentiveVersionId:
          description: 'Identifies the **Saturation-derived** credit''s incentive *version* (not the program) this row was
            copied from. Source tracking uses two fields by origin: `sourceId` for workspace copies, `sourceIncentiveVersionId`
            (+ `sourceType`) for Saturation-derived credits. Null when the row has no incentive origin.'
          anyOf:
          - allOf:
            - $ref: '#/components/schemas/Id'
          - type: 'null'
        sourceType:
          type:
          - string
          - 'null'
          description: The origin class that disambiguates `sourceId` vs `sourceIncentiveVersionId` for a row (e.g. an incentive-derived
            credit). Null when the row has no library origin.
        contact:
          description: Present only with `expand=contact`. The full contact (permission-projected).
          $ref: '#/components/schemas/Contact'
        sourceItem:
          description: 'Present only with `expand=sourceItem`. The live library item `sourceId` points to, or an explicit
            tombstone `{ id, deleted: true }` when the source was removed, never null.'
        values:
          type: object
          description: Present only with `expand=phases`. The per-phase computed value matrix for this line, keyed by phase
            id.
          additionalProperties:
            $ref: '#/components/schemas/PhaseValues'
        phaseData:
          type: object
          description: Present only with `expand=phaseData`. Raw editable estimate phase data keyed by phase id.
          additionalProperties:
            $ref: '#/components/schemas/BudgetDocumentLinePhaseData'
      examples:
      - id: lin_7c1a2f
        code: '1100'
        path: '1100'
        kind: account
        name: Camera
        parentId: lin_root
        depth: 0
        sort: 0
        contactId: null
        tagIds:
        - tag_vfx
        sourceId: null
    BudgetLineCreate:
      type: object
      description: Create a budget line. Allow-list only, server mints `id`, the internal address reference, and all timestamps;
        naming any server-owned field returns `422 field_read_only`.
      required:
