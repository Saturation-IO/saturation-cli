        notes:
          type: string
        tagIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        subtotalSumAllAbove:
          type: boolean
        subtotalIsBold:
          type: boolean
        markupAccountFilter:
          type: string
        phaseData:
          type: object
          description: Optional initial editable phase data keyed by phase id.
          additionalProperties:
            $ref: '#/components/schemas/BudgetLinePhaseDataWrite'
      examples:
      - name: Camera Package
