                  events:
                  - transaction.created
                  - budget.changed
                  payloadStyle: thin
                  isActive: true
                  workspaceId: ws_1a2b3c4d
                  createdAt: '2026-05-28T12:00:00.000Z'
                  updatedAt: '2026-05-28T12:00:00.000Z'
