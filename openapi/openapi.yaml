    post:
      operationId: transactions_items_create
      tags:
      - Transactions
      summary: Add a transaction item
      description: Create an item. The server assigns `lineNumber`. The first item flips the parent `isItemized=true` and
        coding moves from `transaction.budgetLineId` to the items. Row-derived permission `update` on the parent. Fires `transaction.updated`.
        This billable create requires an `Idempotency-Key` header; replaying a key with a different body -> `409 idempotency_conflict`.
