      summary: Liveness / readiness check
      description: Unauthenticated liveness + readiness probe for the public API edge. Confirms the dedicated database pool
        is reachable. Returns `200` when healthy and `503` when a dependency check fails, never a misleading `200` on a degraded
        edge (fail-loud).
      security: []
      responses:
        '200':
          description: The edge is healthy and its dedicated pool is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ok
                time: '2026-05-28T17:04:09.000Z'
                version: 1.0.0
        '503':
          description: A dependency check failed (e.g. the database pool is unreachable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: degraded
                time: '2026-05-28T17:04:09.000Z'
                version: 1.0.0
