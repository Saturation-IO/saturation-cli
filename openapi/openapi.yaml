    BudgetAccount:
      type: object
      description: A derived account view, a budget line where `kind=account`. Accounts are not a separate table; this is
        a projection for browsing the chart of accounts.
      required:
      - id
      - parentId
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        code:
          type:
          - string
          - 'null'
          description: Account number (the `accountId` classifier). Non-unique, may be empty.
        name:
          type: string
          description: Account name.
        parentId:
          $ref: '#/components/schemas/Id'
        path:
          type:
          - string
          - 'null'
          description: Coded account path.
        depth:
          type: integer
      examples:
      - id: lin_7c1a2f
        code: '1100'
        name: Camera
        parentId: lin_root
        path: '1100'
        depth: 0
    BudgetCell:
      type: object
      description: 'A positional cell value, read via explicit `account` + `column` params. This is a computed read like `/budget/totals`:
        `value` is the authoritative value as of `computedAt` (may be slightly stale, not real-time), and the response carries
        `Cache-Control` + opaque `ETag` headers for conditional GET. Echoes the resolved coordinates plus the value.'
      required:
      - account
      - column
      - computedAt
      - value
      additionalProperties: false
      properties:
        account:
          type: string
          description: The resolved account path/code the cell sits on (echoes the request param).
          examples:
          - 1100/1110
        column:
          type: string
          description: The value column read (echoes the request param).
          examples:
          - estimate
        lineId:
          $ref: '#/components/schemas/Id'
        computedAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp at which this cell value was computed. The value reflects state within the cache
            TTL window, not a real-time guarantee. Mirrors the `computedAt` contract of `/budget`, `/budget/totals`, `/budget/rollup`,
            `/budget/variance`.
        value:
          allOf:
          - $ref: '#/components/schemas/PhaseValues'
          description: The computed value matrix for the cell.
      examples:
      - account: 1100/1110
        column: estimate
        lineId: lin_7c1a2f
        computedAt: '2026-05-28T18:04:11Z'
        value:
          base: 1000000
          overtime: 0
          fringe: 0
          fringeBreakdown: []
          amount: 1000000
          combined: 1000000
          currency: USD
    BudgetDocumentPhaseValues:
      type: object
      description: The computed value matrix for one phase in the budget document. All amounts are integers in workspace-base
        minor units; `amount` is the total. The legacy `combined` alias is intentionally omitted from this document shape.
      required:
      - base
      - overtime
      - fringe
      - fringeBreakdown
      - amount
      - currency
      additionalProperties: false
      properties:
        base:
          type: integer
          format: int64
        overtime:
          type: integer
          format: int64
        fringe:
          type: integer
          format: int64
        fringeBreakdown:
          type: array
          items:
            $ref: '#/components/schemas/FringeBreakdownEntry'
        amount:
          type: integer
          format: int64
        currency:
          type: string
          minLength: 3
          maxLength: 3
    BudgetDocumentSelection:
      type: object
      description: Echo of the selector dimensions applied to the budget document.
      additionalProperties: false
      properties:
        path:
          type: string
        accountCode:
          type: string
        phase:
          type: string
    BudgetDocumentLine:
      type: object
      description: One flat line in the budget document. `values` are computed; `phaseData` contains raw editable estimate
        fields keyed by phase id.
      required:
      - id
      - name
      - parentId
      - depth
      - kind
      - values
      - phaseData
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        code:
          type:
          - string
          - 'null'
        name:
          type: string
        parentId:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        path:
          type:
          - string
          - 'null'
        depth:
          type: integer
        kind:
          $ref: '#/components/schemas/ComputedLineKind'
        values:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/BudgetDocumentPhaseValues'
        phaseData:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/BudgetDocumentLinePhaseData'
    BudgetDocument:
      type: object
      description: The full public budget document, combining visible phases, computed totals, flat lines, and editable phase
        data in one response.
      required:
      - id
      - computedAt
      - phaseDataReadAt
      - selection
      - phases
      - totals
      - lines
      additionalProperties: false
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/Id'
          description: "The budget id (`bud_\u2026`)."
        computedAt:
          type: string
          format: date-time
        phaseDataReadAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp after the raw phase-data rows were read.
        selection:
          $ref: '#/components/schemas/BudgetDocumentSelection'
        phases:
          type: array
          items:
            $ref: '#/components/schemas/BudgetPhase'
        totals:
          type: object
          description: Root or selected-subtree totals keyed by visible phase id.
          additionalProperties:
            $ref: '#/components/schemas/BudgetDocumentPhaseValues'
        lines:
          type: array
          description: Flat array of selected rows; rebuild the tree from `parentId`.
          items:
            $ref: '#/components/schemas/BudgetDocumentLine'
    BudgetTotals:
      type: object
      description: Computed grand totals (or, with supported filters, the computed slice total) as of `computedAt`. Supported
        filters are `phase`, `accountId`, and `path`. The filtered rollup is computed server-side; never summed client-side.
      required:
      - computedAt
      - totals
      additionalProperties: false
      properties:
        computedAt:
          type: string
          format: date-time
        totals:
          type: object
          description: Per-phase totals for the requested slice, keyed by phase id.
          additionalProperties:
            $ref: '#/components/schemas/PhaseValues'
        filter:
          type: object
          description: Echo of the applied filter slice (present when any filter was supplied), so the computed number is
            self-describing.
          additionalProperties: false
          properties:
            phase:
              type: string
            accountId:
              type: string
            path:
              type: string
      examples:
      - computedAt: '2026-05-28T18:04:11Z'
        totals:
          phs_estimate:
            base: 1000000
            overtime: 0
            fringe: 220000
            fringeBreakdown: []
            amount: 1220000
            combined: 1220000
            currency: USD
    BudgetRollup:
      type: object
      description: Computed rollup for a single phase, as of `computedAt`.
      required:
      - computedAt
      - phase
      - values
      additionalProperties: false
      properties:
        computedAt:
          type: string
          format: date-time
        phase:
          allOf:
          - $ref: '#/components/schemas/BudgetPhase'
          description: The phase the rollup is for.
        values:
          allOf:
          - $ref: '#/components/schemas/PhaseValues'
          description: The computed rollup value for the phase.
      examples:
      - computedAt: '2026-05-28T18:04:11Z'
        phase:
          id: phs_estimate
          type: estimate
          name: Estimate
          sort: 0
          isHidden: false
        values:
          base: 1000000
          overtime: 0
          fringe: 220000
          fringeBreakdown: []
          amount: 1220000
          combined: 1220000
          currency: USD
    BudgetVariance:
      type: object
      description: Computed variance between two phases (`to` minus `from`), as of `computedAt`. `delta` is the difference
        per value field in workspace-base minor units.
      required:
      - computedAt
      - from
      - to
      - delta
      additionalProperties: false
      properties:
        computedAt:
          type: string
          format: date-time
        from:
          allOf:
          - $ref: '#/components/schemas/PhaseValues'
          description: Values of the `from` phase.
        to:
          allOf:
          - $ref: '#/components/schemas/PhaseValues'
          description: Values of the `to` phase.
        delta:
          allOf:
          - $ref: '#/components/schemas/PhaseValues'
          description: "Per-field difference (`to` \u2212 `from`), computed."
      examples:
      - computedAt: '2026-05-28T18:04:11Z'
        from:
          base: 1000000
          overtime: 0
          fringe: 220000
          fringeBreakdown: []
          amount: 1220000
          combined: 1220000
          currency: USD
        to:
          base: 1100000
          overtime: 0
          fringe: 242000
          fringeBreakdown: []
          amount: 1342000
          combined: 1342000
          currency: USD
        delta:
          base: 100000
          overtime: 0
          fringe: 22000
          fringeBreakdown: []
          amount: 122000
          combined: 122000
          currency: USD
    DocumentTargetKind:
      type: string
      description: The kind of entity a document can be assigned to. v1 is single-target-per-kind (one reference per kind
        on the document). `contact` is workspace-scoped (contacts have no project), the rest are project-scoped.
      enum:
      - transaction
      - purchaseOrder
      - contact
      - project
      examples:
      - transaction
    DocumentStatus:
      type: string
      description: Document processing status. A new document is `PENDING` or `PROCESSING` until extraction finishes. `READY`
        means its content can be queried. `FAILED` means extraction did not finish. This field is read-only and set by Saturation.
      enum:
      - pending
      - processing
      - ready
      - failed
      examples:
      - READY
    DocumentCoarseType:
      type: string
      description: The coarse content category inferred during extraction.
      enum:
      - financial
      - tax
      - legal
      - insurance
      - production
      - other
      examples:
      - financial
    DocumentExpand:
      type: string
      description: "A single expand key valid on document responses. Pass as a comma list via `expand` (depth \u2264 2); an\
        \ unknown key returns `400 expand_invalid`. Expanded relations are permission-projected."
      enum:
      - assignments
      - transaction
      - contact
      - purchaseOrder
      - folder
    DocumentTargetRef:
      type: object
      description: A typed reference to the entity a document is (or should be) assigned to. The raw internal domain `address`
        is never used on the public surface, targets are always `{ kind, id }`.
      required:
      - kind
      - id
      additionalProperties: false
      properties:
        kind:
          $ref: '#/components/schemas/DocumentTargetKind'
        id:
          allOf:
          - $ref: '#/components/schemas/Id'
          description: "The target entity's canonical id, matching `kind` (`txn_\u2026`, `lin_\u2026`, `po_\u2026`, `con_\u2026\
            `, `prj_\u2026`)."
      examples:
      - kind: transaction
        id: txn_8f2a1c9e
    Document:
      type: object
      description: A document. Dropped once, then assigned to typed targets. Server-owned fields (`workspaceId`, `uploaderId`,
        `status`, `contentHash`, timestamps) are read-only; the per-kind assignment reference are surfaced as the typed `assignments`
        array, not as fields. The internal workspaceId / `soft-delete timestamp` are never exposed.
      required:
      - id
      - name
      - mimeType
      - size
      - status
      - workspaceId
      - assignments
      - createdAt
      - updatedAt
      additionalProperties: false
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/Id'
          description: "Canonical document id (`doc_\u2026`)."
        name:
          type: string
          description: The document's display name (file name). Writable via `PATCH`.
        mimeType:
          type: string
          description: The stored file's MIME type.
          examples:
          - application/pdf
        size:
          type: integer
          format: int64
          description: The stored file's size in bytes.
          examples:
          - 184320
        status:
          $ref: '#/components/schemas/DocumentStatus'
        workspaceId:
          allOf:
          - $ref: '#/components/schemas/Id'
          description: "The workspace this document belongs to (`ws_\u2026`). Server-owned, read-only."
        pageCount:
          type:
          - integer
          - 'null'
          description: Number of pages, once extraction has determined it. Null until `READY`.
        classification:
          type:
          - string
          - 'null'
          description: Fine-grained classification inferred during extraction (e.g. `invoice`, `receipt`).
        coarseType:
          description: Coarse content category. Null until extraction has classified the document.
          anyOf:
          - allOf:
            - $ref: '#/components/schemas/DocumentCoarseType'
          - type: 'null'
        hasSensitiveInfo:
          type:
          - boolean
          - 'null'
          description: Whether extraction flagged the document as containing sensitive information.
        description:
          type:
          - string
          - 'null'
          description: Optional free-text description. Writable via `PATCH`.
        source:
          type:
          - string
          - 'null'
          description: How the document entered the workspace (e.g. `api`, `agent`, `upload`). Read-only.
        folderId:
          description: "The folder this document lives in (`fld_\u2026`), or null at the workspace root. Writable via `PATCH`."
          anyOf:
          - allOf:
            - $ref: '#/components/schemas/Id'
          - type: 'null'
        projectId:
          description: "The project this document is scoped to (`prj_\u2026`). Derived from a project-scoped assign target;\
            \ null for workspace-only (e.g. contact-attached) documents."
          anyOf:
          - allOf:
            - $ref: '#/components/schemas/Id'
          - type: 'null'
        contentHash:
          type:
          - string
          - 'null'
          description: Content hash of the stored file (dedupe / caching). Read-only.
        assignments:
          type: array
          description: 'Every entity this document is currently assigned to, derived from the document''s non-null per-kind
            reference (single-reference v1: at most one per kind).'
          items:
            $ref: '#/components/schemas/DocumentTargetRef'
        createdAt:
          type: string
          format: date-time
          description: ISO-8601 creation timestamp.
        updatedAt:
          type: string
          format: date-time
          description: ISO-8601 last-modified timestamp.
      examples:
      - id: doc_4b1f0a7c
        name: vendor-invoice-0425.pdf
        mimeType: application/pdf
        size: 184320
        status: READY
