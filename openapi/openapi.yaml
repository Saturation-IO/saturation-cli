openapi: 3.1.0
info:
  title: Saturation API
  version: 1.0.0
  description: 'The Saturation API lets you read and write production finance data. You work with budgets, transactions, purchase
    orders, payment requests, payments, documents, contacts, and the Library. You can search across them and subscribe to
    webhooks when data changes. Authenticate every request with a personal token in the Authorization header: Authorization:
    Bearer <token> Create a token in Saturation under Settings > Developers > API. The token acts as you in the workspace
    where it was created. Conventions:

    - A successful response is the resource itself. A list is a data array with a nextCursor. Only errors are wrapped, as
    { success: false, code, message, requestId }, with a typed code you can branch on.

    - Money is an integer amount of minor units with a currency, for example { "amount": 152900, "currency": "USD" }. Dates
    are ISO-8601 strings.

    - Lists are paginated. Pass limit (up to 100, default 50) and the cursor from the previous response. Pass withCount=true
    for a total.

    - 404 not_found is returned when a resource is missing or you cannot read it, so existence never leaks.'
  contact:
    name: Saturation API
    url: https://docs.saturation.io
  license:
    name: Proprietary
    url: https://saturation.io/terms
servers:
- url: https://next-api.saturation.io/v1
  description: Production
- url: http://localhost:4300/v1
  description: Local development
security:
- bearerAuth: []
tags:
- name: Meta
  description: Identity and health. GET /me resolves the current token's identity and works before you know a workspace id.
    GET /healthz is an unauthenticated health check.
- name: Workspaces
  description: The workspace your token can act in.
- name: Projects
  description: Create, read, update, and delete projects. A project is addressable by its slug or its id.
- name: Spaces
  description: Folders that group projects in a workspace.
- name: Contacts
  description: Your workspace contacts (vendors, crew, payees) and their documents.
- name: Tokens
  description: List, inspect, and revoke your API tokens. You create tokens in Saturation under Settings > Developers > API;
    these routes manage them after that.
- name: Usage
  description: Usage and credit reports for a token, a workspace, or a project.
- name: Library (workspace)
  description: 'The workspace Library, where you set up reusable budget building blocks: rate packs, incentive packs, fringes,
    globals, currencies, tags, and units. You enable packs here, then add items to a project.'
- name: Library (project)
  description: 'The Library items added to one project: rate packs, incentives, fringes, globals, and currencies. Each item
    remembers its source (`sourceId` for workspace copies, `sourceIncentiveVersionId` for Saturation incentive versions),
    and you can edit it without changing the original.'
- name: Budget
  description: Read a project budget and its computed totals (lines, phases, accounts, rollups, and variance) and edit budget
    lines and phases. A computed read can return 504 budget_compute_timeout or 413 budget_too_large.
- name: Transactions
  description: The unified financial record. Each transaction has a source, type, and status, with itemized lines, stats,
    and document lookups.
- name: Purchase Orders
  description: Purchase orders with a read-only status, current Activity, a financial Summary, linked records, suggested matches,
    and a Timeline.
- name: Payment Requests
  description: Requests to pay a person or company. A request stays separate from the payment that follows.
- name: Payments
  description: Payments from request through settlement, with linked records and a Timeline.
- name: Documents
  description: Upload a document once, then assign it to a transaction, budget line, purchase order, or contact. You can also
    read a document's content and manage its assignments.
- name: Search
  description: Search across transactions, documents, contacts, and budget lines, at workspace or project scope. You only
    see results you have permission to read, and results are paginated.
- name: Comments
  description: Comments on entities in a workspace.
- name: Webhooks
  description: Subscribe an endpoint to data-change events. Manage subscriptions, send a test delivery, and review delivery
    history. Each delivery is signed (X-Saturation-Signature) so you can verify it.
- name: Views
  description: Saved filters you can reuse. A view stores a filter you can apply by id, and you can add more filters on top
    of it.
paths:
  /projects/{projectId}/budget:
    get:
      operationId: budget_getDocument
      summary: Get the budget document (tree + phases + totals + editable phase data)
      description: Returns the budget document as a flat array of lines (rebuild the tree from `parentId`), visible phase
        columns, computed totals, and editable estimate phase data, all in one response. Use `path` or `accountCode` to narrow
        a large budget before the server line ceiling is applied. `accountId`, tag filters, date windows, hidden phases, and
        `expand` are rejected on this document read.
      tags:
      - Budget
      parameters:
      - $ref: '#/components/parameters/projectId'
      - name: path
        in: query
        required: false
        description: Materialized account path (for example `1100/1110`) naming exactly one root line and its descendants.
        schema:
          type: string
      - name: accountCode
        in: query
        required: false
        description: Leaf account code naming exactly one root line and its descendants. Duplicate codes return `409 account_code_ambiguous`.
        schema:
          type: string
      - name: phase
        in: query
        required: false
        description: Visible phase id, alias, name, or type. Ambiguous selectors return `400 validation`; hidden phases are
          excluded.
        schema:
          type: string
      - name: accountId
        in: query
        required: false
        deprecated: true
        description: Rejected on `GET /budget`; use `accountCode`.
        schema:
          type: string
      - name: tags
        in: query
        required: false
        deprecated: true
        description: Rejected on `GET /budget`; tag-filtered documents are deferred.
        schema:
          type: string
      - name: tagMode
        in: query
        required: false
        deprecated: true
        description: Rejected on `GET /budget`; tag-filtered documents are deferred.
        schema:
          $ref: '#/components/schemas/TagMode'
      - name: dateFrom
        in: query
        required: false
        deprecated: true
        description: Rejected on `GET /budget`; date-windowed documents are deferred.
        schema:
          type: string
      - name: dateTo
        in: query
        required: false
        deprecated: true
        description: Rejected on `GET /budget`; date-windowed documents are deferred.
        schema:
          type: string
      - name: includeHiddenPhases
        in: query
        required: false
        deprecated: true
        description: Rejected on `GET /budget`; hidden phases are intentionally excluded.
        schema:
          type: boolean
      - name: expand
        in: query
        required: false
        deprecated: true
        description: Rejected on budget document reads; the document is already fully shaped.
        schema:
          type: string
      - name: If-None-Match
        in: header
        required: false
        description: Conditional GET. Pass a prior `ETag`; an unchanged budget (for the same caller's permission projection)
          returns `304 Not Modified`. The permission gate is re-run before any `304`, so a foreign-tenant or stale ETag never
          short-circuits authorization.
        schema:
          type: string
      responses:
        '200':
          description: The budget document.
          headers:
            ETag:
              description: Opaque validator per (budget, permission-projection). Pass back as `If-None-Match`.
              schema:
                type: string
            Cache-Control:
              description: '`max-age=T`, the bounded-staleness window (the cache TTL).'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetDocument'
        '304':
          description: Not modified, the ETag matched (permission re-checked first).
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '429':
          $ref: '#/components/responses/Error429'
        '504':
          $ref: '#/components/responses/Error504'
  /projects/{projectId}/budget/totals:
    get:
      operationId: budget_getTotals
      summary: Get grand totals (optionally for a filtered slice)
      description: Returns the engine's grand totals as of `computedAt`. With supported filters (`phase`, `accountId`/`path`
        subtree) the response is the engine-coalesced slice total, computed server-side and never summed by the client. `path`
        matches only the materialized account path; `accountId` is a code classifier and can be ambiguous. `expand` is rejected.
      tags:
      - Budget
      parameters:
      - $ref: '#/components/parameters/projectId'
      - name: phase
        in: query
        required: false
        description: Narrow to one phase, by phase id or `type` (e.g. `estimate`).
        schema:
          type: string
        example: estimate
      - name: accountId
        in: query
        required: false
        description: Account code classifier, subtree-scopes the slice (a code may sit on many rows).
        schema:
          type: string
        example: '1100'
      - name: path
        in: query
        required: false
        description: Coded account path to subtree-scope the slice (e.g. `1100/1110`).
        schema:
          type: string
        example: 1100/1110
      - name: If-None-Match
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Totals for the (optionally filtered) slice.
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetTotals'
        '304':
          description: Not modified, the ETag matched (permission re-checked first).
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '429':
          $ref: '#/components/responses/Error429'
        '504':
          $ref: '#/components/responses/Error504'
  /projects/{projectId}/budget/rollup:
    get:
      operationId: budget_getRollup
      summary: Get the engine rollup for a phase
      description: Returns the computed rollup for a single phase as of `computedAt`. `expand` is not supported.
      tags:
      - Budget
      parameters:
      - $ref: '#/components/parameters/projectId'
      - name: phase
        in: query
        required: true
        description: The phase id (or `type`, e.g. `estimate`) to roll up.
        schema:
          type: string
        example: estimate
      - name: If-None-Match
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: The phase rollup.
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetRollup'
        '304':
          description: Not modified, the ETag matched (permission re-checked first).
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '413':
          $ref: '#/components/responses/Error413'
        '429':
          $ref: '#/components/responses/Error429'
        '504':
          $ref: '#/components/responses/Error504'
  /projects/{projectId}/budget/variance:
    get:
      operationId: budget_getVariance
      summary: Get computed variance between two phases
      description: Returns the computed variance (`to` minus `from`) between two phases as of `computedAt`. `expand` is rejected.
      tags:
      - Budget
      parameters:
      - $ref: '#/components/parameters/projectId'
      - name: from
        in: query
        required: true
        description: The baseline phase id (or `type`).
        schema:
          type: string
        example: estimate
      - name: to
        in: query
        required: true
        description: The comparison phase id (or `type`).
        schema:
          type: string
        example: actual
      - name: If-None-Match
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: The phase-to-phase variance.
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetVariance'
        '304':
          description: Not modified, the ETag matched (permission re-checked first).
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '413':
          $ref: '#/components/responses/Error413'
        '429':
          $ref: '#/components/responses/Error429'
        '504':
          $ref: '#/components/responses/Error504'
  /projects/{projectId}/budget/cells:
    get:
      operationId: budget_getCell
      summary: Read one budget value by account and column
      description: 'Reads one budget value by `account` + `column`, never a raw domain address. `account` accepts a path/code;
        `column` names the value column (e.g. a phase). Wildcard/subtree pattern reads stay internal-only. The value is computed
        server-side as of `computedAt`, with the same caching behavior as `/budget/totals`: the value is the engine''s truth
        as of `computedAt` (in the body), the response carries `Cache-Control: max-age=T` + an opaque `ETag` header, and a
        conditional GET (`If-None-Match`) re-runs the row-derived permission gate before returning `304`. `expand` is rejected
        (`400 expand_invalid`); a warm-up miss returns `504 budget_compute_timeout`.'
      tags:
      - Budget
      parameters:
      - $ref: '#/components/parameters/projectId'
      - name: account
        in: query
        required: true
        description: The account path or code the cell sits on (e.g. `1100/1110`). Not an address.
        schema:
          type: string
        example: 1100/1110
      - name: column
        in: query
        required: true
        description: The value column to read (e.g. a phase id or `type` such as `estimate`).
        schema:
          type: string
        example: estimate
      - name: If-None-Match
        in: header
        required: false
        description: Conditional GET. Pass a prior `ETag`; an unchanged cell (for the same caller's permission projection)
          returns `304 Not Modified`. The permission gate is re-run before any `304`.
        schema:
          type: string
      responses:
        '200':
          description: The cell value, as of `computedAt`.
          headers:
            ETag:
              description: Opaque validator per (budget, permission-projection). Pass back as `If-None-Match`.
              schema:
                type: string
            Cache-Control:
              description: '`max-age=T`, the bounded-staleness window (the cache TTL).'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetCell'
        '304':
          description: Not modified, the ETag matched (permission re-checked first).
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '429':
          $ref: '#/components/responses/Error429'
        '504':
          $ref: '#/components/responses/Error504'
  /projects/{projectId}/budget/lines:
    get:
      operationId: budget_listLines
      summary: List budget lines (paginated, filterable)
      description: 'Browse/edit individual stored budget lines, paginated. Filters AND-compose. `accountId` is a classifier
        and returns a set (an account code can sit on many rows); `path` returns exactly one row (or `409 account_path_ambiguous`
        if a coded path matches more than one live row). For the complete budget document use `GET /budget`. Expand keys:
        `phases, phaseData, contact, account, sourceItem`; `phaseData` returns raw editable estimate phase data keyed by phase
        id. (The legacy `lines.notes` expand is not ported, the note is a plain-text `line.notes` field always present inline;
        see `BudgetLine.notes`.)'
      tags:
      - Budget
      parameters:
      - $ref: '#/components/parameters/projectId'
      - name: accountId
        in: query
        required: false
        description: Account code classifier, returns a SET (a code may sit on many rows). Use `path`/`id` for an exact single-row
          read.
        schema:
          type: string
        example: '1100'
      - name: path
        in: query
        required: false
        description: Coded account path for an exact single-row read (e.g. `1100/1110`). A coded path matching more than one
          live row returns `409 account_path_ambiguous`.
        schema:
          type: string
        example: 1100/1110
      - name: tags
        in: query
        required: false
        description: Comma-separated tag ids/names; composed per `tagMode`.
        schema:
          type: string
        example: vfx
      - name: tagMode
        in: query
        required: false
        description: How `tags` composes (`any` = OR default, `all` = AND, `none` = exclude).
        schema:
          $ref: '#/components/schemas/TagMode'
      - name: kind
        in: query
        required: false
        description: Filter by the `kind` discriminator (comma-separated for multiple).
        schema:
          type: string
        example: line,account
      - $ref: '#/components/parameters/budgetLineExpand'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/withCount'
      responses:
        '200':
          description: A page of budget lines.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BudgetLine'
                  nextCursor:
                    $ref: '#/components/schemas/NextCursor'
                  count:
                    type: integer
                    description: Total matching lines; present only when `withCount=true`.
                  truncated:
                    type: boolean
                    description: True when a permission/expand under-fetch bounded the page short of `limit`.
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
    post:
      operationId: budget_createLine
      summary: Create a budget line with optional phase data
      description: Creates a stored budget line under `parentId`, optionally with initial editable phase data keyed by phase
        id. Server mints `id`, the internal address reference, and timestamps, they cannot be client-supplied. Naming a server-owned
        field returns `422 field_read_only`. Emits a durable `budgetLine.created` audit event.
      tags:
      - Budget
      parameters:
      - $ref: '#/components/parameters/projectId'
      - name: Idempotency-Key
        in: header
        required: true
        description: 'Required client-generated key (16-255 chars) for exactly-once creation. Retrying with the same key replays
          the original result (`Idempotency-Replayed: true`); the same key with a different body returns `409 idempotency_conflict`.
          Missing or too-short key returns `400 validation`.'
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetLineCreate'
      responses:
        '201':
          description: The created budget line.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetLine'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
  /projects/{projectId}/budget/lines/batch:
    post:
      operationId: budget_createLinesBatch
      summary: Create budget lines in one all-or-nothing batch
      description: 'Creates multiple stored budget lines, each optionally carrying initial editable phase data keyed by phase
        id. The batch is transactional: either every line and phase-data entry is written, or none are. A required `Idempotency-Key`
        provides exactly-once same-body retries.'
      tags:
      - Budget
      parameters:
      - $ref: '#/components/parameters/projectId'
      - name: Idempotency-Key
        in: header
        required: true
        description: 'Required client-generated key (16-255 chars) for exactly-once creation. Retrying with the same key replays
          the original result (`Idempotency-Replayed: true`); the same key with a different body returns `409 idempotency_conflict`.
          Missing or too-short key returns `400 validation`.'
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetLineBatchCreate'
      responses:
        '201':
          description: The created budget lines in request order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetLineBatchCreateResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
  /projects/{projectId}/budget/lines/phase-data/batch:
    post:
      operationId: budget_upsertLinePhaseDataBatch
      summary: Upsert editable line phase data in one all-or-nothing batch
      description: 'Upserts raw editable estimate phase data for existing lines and phases. The batch is transactional: either
        every phase-data entry is written, or none are. A required `Idempotency-Key` provides exactly-once same-body retries.'
      tags:
      - Budget
      parameters:
      - $ref: '#/components/parameters/projectId'
      - name: Idempotency-Key
        in: header
        required: true
        description: 'Required client-generated key (16-255 chars) for exactly-once creation. Retrying with the same key replays
          the original result (`Idempotency-Replayed: true`); the same key with a different body returns `409 idempotency_conflict`.
          Missing or too-short key returns `400 validation`.'
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetLinePhaseDataBatchUpsert'
      responses:
        '200':
          description: The normalized editable phase data after the upsert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetLinePhaseDataBatchUpsertResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
  /projects/{projectId}/budget/lines/{lineId}:
    get:
      operationId: budget_getLine
      summary: Get a budget line by id
      tags:
      - Budget
      parameters:
      - $ref: '#/components/parameters/projectId'
      - name: lineId
        in: path
        required: true
        description: "Budget line identifier (`lin_\u2026`)."
        schema:
          $ref: '#/components/schemas/Id'
      - $ref: '#/components/parameters/budgetLineExpand'
      responses:
        '200':
          description: The budget line.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetLine'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
    patch:
      operationId: budget_updateLine
      summary: Update a budget line
      description: Patches the provider-writable allow-list, optionally upserting editable phase data keyed by phase id. Naming
        a server-owned field (`address`, `budgetId`, `path`, `depth`, timestamps) returns `422 field_read_only` listing offenders,
        never a silent strip. Emits a durable `budgetLine.updated` audit event.
      tags:
      - Budget
      parameters:
      - $ref: '#/components/parameters/projectId'
      - name: lineId
        in: path
        required: true
        description: "Budget line identifier (`lin_\u2026`)."
        schema:
          $ref: '#/components/schemas/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetLineUpdate'
      responses:
        '200':
          description: The updated budget line.
          content:
