[package]
name = "saturation-cli"
version = "0.2.0"
edition = "2021"
description = "CLI for the Saturation public API, production finance resources, and agent tools"
license = "MIT"
repository = "https://github.com/Saturation-IO/saturation-cli"
homepage = "https://docs.saturation.io/#/sdks"
readme = "README.md"
build = "build.rs"
rust-version = "1.85"
keywords = ["saturation", "production-finance", "api", "cli"]
categories = ["command-line-utilities", "finance"]

[[bin]]
name = "saturation"
path = "src/main.rs"

[features]
# Run progenitor at build time to (re)generate the typed /v1 client from
# openapi/openapi.yaml. Off by default: the committed src/v1/generated.rs builds
# offline. Enabling this pulls a large transitive tree (typify, openapiv3,
# schemars, a vendored rustfmt). See build.rs and the README.
progenitor-gen = []

[dependencies]
# CLI framework
clap = { version = "4", features = ["derive", "env", "string"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client. rustls (not native-tls/OpenSSL) for a portable, statically-linked
# binary: a distributed `saturation` has no libssl runtime dependency. See
# docs/next/agents/20260617-desktop-pi-dev/saturation-cli-v1-bundling.md (WS-A).
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls", "charset", "http2"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Config and filesystem
dirs = "6"

# Terminal output
colored = "3"

# URL handling
url = "2"

# Timestamp handling
chrono = { version = "0.4", features = ["serde"] }

# Base64 (for JWT payload decoding)
base64 = "0.22"

# Progenitor codegen toolchain. Uncomment to regenerate the typed /v1 client at
# build time (with `--features progenitor-gen`). Pinned, pure-Rust, reqwest-native
# — no JVM/codegen-server, matching the crate's reqwest 0.12 stack.
# [build-dependencies]
# progenitor = "0.14"
# openapiv3 = "2"
# serde_yaml = "0.9"
# syn = "2"
# prettyplease = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
wiremock = "0.6"
tokio-test = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1

# The profile used by dist for release archives and installers.
[profile.dist]
inherits = "release"
lto = "thin"
