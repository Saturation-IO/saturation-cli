[package]
name = "saturation-cli"
version = "0.2.0"
edition = "2021"
description = "CLI for the Saturation public API and production finance resources"
license = "MIT"
repository = "https://github.com/Saturation-IO/saturation-cli"
homepage = "https://docs.saturation.io"
readme = "README.md"
build = "build.rs"
rust-version = "1.85"
keywords = ["saturation", "production-finance", "api", "cli"]
categories = ["command-line-utilities", "finance"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE",
    "README.md",
    "build.rs",
    "openapi/openapi.yaml",
    "src/**",
]

[[bin]]
name = "saturation"
path = "src/main.rs"

[dependencies]
# CLI framework
clap = { version = "4", features = ["derive", "env", "string"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client. rustls avoids a system OpenSSL runtime dependency in distributed
# binaries.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls", "charset", "http2"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Config and filesystem
dirs = "6"

# Terminal output
colored = "3"

# URL handling
url = "2"

# Timestamp handling
chrono = { version = "0.4", features = ["serde"] }

# Base64 (for JWT payload decoding)
base64 = "0.22"
rand = "0.9"
sha2 = "0.10"
open = "5"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
wiremock = "0.6"
tokio-test = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1

# The profile used by dist for release archives and installers.
[profile.dist]
inherits = "release"
lto = "thin"
